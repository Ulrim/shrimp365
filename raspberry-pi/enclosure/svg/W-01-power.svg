<text x="24.00" y="266.00" font-family="sans-serif" font-size="3.60" text-anchor="start" fill="#c00000" font-weight="bold">LK1 이 빠지면 센서계와 파이계의 0V 가 서로 떠서 RS485 공통모드가 벗어난다.</text>
<text x="24.00" y="272.00" font-family="sans-serif" font-size="3.60" text-anchor="start" fill="#c00000" font-weight="bold">간헐적 CRC 오류로만 나타나 출고 검사에서 잡히지 않는다. 반드시 도통을 확인할 것.</text>
<rect x="244.00" y="259.00" width="168.00" height="30.00" fill="#fff" stroke="#202020" stroke-width="0.6"/>
<line x1="244.00" y1="274.00" x2="412.00" y2="274.00" stroke="#202020" stroke-width="0.4"/>
<text x="247.00" y="269.50" font-family="sans-serif" font-size="6.00" text-anchor="start" fill="#202020" font-weight="bold">전원 계통도</text>
<text x="247.00" y="283.00" font-family="sans-serif" font-size="3.60" text-anchor="start" fill="#202020" font-weight="normal">Shrimp365 수질 모니터링 장비 — 내부 배선</text>
<text x="409.00" y="283.00" font-family="sans-serif" font-size="3.60" text-anchor="end" fill="#202020" font-weight="normal">도번 W-01   Rev.A</text>
<text x="14.00" y="22.00" font-family="sans-serif" font-size="4.60" text-anchor="start" fill="#202020" font-weight="bold">주기</text>
<text x="14.00" y="27.00" font-family="sans-serif" font-size="3.30" text-anchor="start" fill="#202020" font-weight="normal">1.</text>
<text x="20.00" y="27.00" font-family="sans-serif" font-size="3.30" text-anchor="start" fill="#202020" font-weight="normal">AC 220V 50/60Hz 단상 입력. 계통 단선도이며 배선 경로가 아니다.</text>
<text x="14.00" y="32.00" font-family="sans-serif" font-size="3.30" text-anchor="start" fill="#202020" font-weight="normal">2.</text>
<text x="20.00" y="32.00" font-family="sans-serif" font-size="3.30" text-anchor="start" fill="#202020" font-weight="normal">F1 2A 슬로우블로우 / F2 24V 1A / F3 5V 5A. SPD 는 온도퓨즈 내장형만 쓴다.</text>
<text x="14.00" y="37.00" font-family="sans-serif" font-size="3.30" text-anchor="start" fill="#202020" font-weight="normal">3.</text>
<text x="20.00" y="37.00" font-family="sans-serif" font-size="3.30" text-anchor="start" fill="#202020" font-weight="normal">DDR-30G-5 는 입출력이 4000VDC 절연이다. 0V-P 와 0V-S 는 서로 다른 노드이고,</text>
<text x="20.00" y="42.00" font-family="sans-serif" font-size="3.30" text-anchor="start" fill="#202020" font-weight="normal">LK1 을 넣지 않으면 두 계통이 떠 있게 된다.</text>
<text x="14.00" y="47.00" font-family="sans-serif" font-size="3.30" text-anchor="start" fill="#202020" font-weight="normal">4.</text>
<text x="20.00" y="47.00" font-family="sans-serif" font-size="3.30" text-anchor="start" fill="#202020" font-weight="normal">LK2 는 0V-P 를 PE 에 한 점에서 묶는다. 기본 장착이며 접지 루프가 의심되면 분리한다.</text>
<text x="14.00" y="52.00" font-family="sans-serif" font-size="3.30" text-anchor="start" fill="#202020" font-weight="normal">5.</text>
<text x="20.00" y="52.00" font-family="sans-serif" font-size="3.30" text-anchor="start" fill="#202020" font-weight="normal">벅 출력은 무부하에서 5.15V 로 조정한 뒤 파이를 연결한다.</text>
<text x="14.00" y="57.00" font-family="sans-serif" font-size="3.30" text-anchor="start" fill="#202020" font-weight="normal">6.</text>
<text x="20.00" y="57.00" font-family="sans-serif" font-size="3.30" text-anchor="start" fill="#202020" font-weight="normal">디스플레이 5V 는 파이 GPIO 가 아니라 5V 레일에서 직접 받는다 — 0.5A 를 파이</text>
<text x="20.00" y="62.00" font-family="sans-serif" font-size="3.30" text-anchor="start" fill="#202020" font-weight="normal">기판에 흘리지 않기 위해서다. 양쪽을 동시에 물리지 말 것.</text>
<text x="14.00" y="67.00" font-family="sans-serif" font-size="3.30" text-anchor="start" fill="#202020" font-weight="normal">7.</text>
<text x="20.00" y="67.00" font-family="sans-serif" font-size="3.30" text-anchor="start" fill="#202020" font-weight="normal">HDR-60-24 는 클래스 II 라 FG 단자가 없다. PE 는 SMPS 를 거치지 않는다.</text>
