<text x="216.00" y="207.00" font-family="sans-serif" font-size="3.30" text-anchor="start" fill="#202020" font-weight="normal">센서 1·2·3 핀 1</text>
<text x="324.00" y="207.00" font-family="sans-serif" font-size="3.30" text-anchor="start" fill="#202020" font-weight="normal">0.75 빨강</text>
