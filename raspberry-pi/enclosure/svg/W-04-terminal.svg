<rect x="40" y="239.5" width="340" height="10" fill="#c00000" opacity="0.07"/>
<text x="40.00" y="268.00" font-family="sans-serif" font-size="4.00" text-anchor="start" fill="#c00000" font-weight="bold">★ 8극(본딩)은 예비극이 아니다. 5극과 점퍼로 묶고 변환기 GND 를 여기에 문다.</text>
<rect x="244.00" y="259.00" width="168.00" height="30.00" fill="#fff" stroke="#202020" stroke-width="0.6"/>
<line x1="244.00" y1="274.00" x2="412.00" y2="274.00" stroke="#202020" stroke-width="0.4"/>
<text x="247.00" y="269.50" font-family="sans-serif" font-size="6.00" text-anchor="start" fill="#202020" font-weight="bold">단자대 8P 배치 · 결선도</text>
<text x="247.00" y="283.00" font-family="sans-serif" font-size="3.60" text-anchor="start" fill="#202020" font-weight="normal">Shrimp365 수질 모니터링 장비 — 내부 배선</text>
<text x="409.00" y="283.00" font-family="sans-serif" font-size="3.60" text-anchor="end" fill="#202020" font-weight="normal">도번 W-04   Rev.A</text>
<text x="14.00" y="22.00" font-family="sans-serif" font-size="4.60" text-anchor="start" fill="#202020" font-weight="bold">주기</text>
<text x="14.00" y="27.00" font-family="sans-serif" font-size="3.30" text-anchor="start" fill="#202020" font-weight="normal">1.</text>
<text x="20.00" y="27.00" font-family="sans-serif" font-size="3.30" text-anchor="start" fill="#202020" font-weight="normal">단단 8극. 220V/접지 3극 + 12V 2극 + RS485 2극 + 본딩 1극.</text>
<text x="14.00" y="32.00" font-family="sans-serif" font-size="3.30" text-anchor="start" fill="#202020" font-weight="normal">2.</text>
<text x="20.00" y="32.00" font-family="sans-serif" font-size="3.30" text-anchor="start" fill="#202020" font-weight="normal">220V 극과 저압 극이 한 단자대에 섞여 있다. 극 사이 절연 격벽이 있는 제품을 쓰고,</text>
<text x="20.00" y="37.00" font-family="sans-serif" font-size="3.30" text-anchor="start" fill="#202020" font-weight="normal">1~3극 위에 투명 절연 커버를 덮는다.</text>
<text x="14.00" y="42.00" font-family="sans-serif" font-size="3.30" text-anchor="start" fill="#202020" font-weight="normal">3.</text>
<text x="20.00" y="42.00" font-family="sans-serif" font-size="3.30" text-anchor="start" fill="#202020" font-weight="normal">3극(PE)에는 녹/황 전선만 쓰고 단자대에 별도 접지 표시를 붙인다.</text>
<text x="14.00" y="47.00" font-family="sans-serif" font-size="3.30" text-anchor="start" fill="#202020" font-weight="normal">4.</text>
<text x="20.00" y="47.00" font-family="sans-serif" font-size="3.30" text-anchor="start" fill="#202020" font-weight="normal">8극은 예비가 아니라 본딩 전용이다 — W-01·W-03 참조.</text>
<text x="20.00" y="52.00" font-family="sans-serif" font-size="3.30" text-anchor="start" fill="#202020" font-weight="normal">여기를 비워 두면 RS485 가 간헐적으로 끊긴다.</text>
<text x="14.00" y="57.00" font-family="sans-serif" font-size="3.30" text-anchor="start" fill="#202020" font-weight="normal">5.</text>
<text x="20.00" y="57.00" font-family="sans-serif" font-size="3.30" text-anchor="start" fill="#202020" font-weight="normal">센서 3대를 4·5·6·7극에 병렬로 문다. 극당 3가닥이므로 압착 단자로 정리한다.</text>
<text x="14.00" y="62.00" font-family="sans-serif" font-size="3.30" text-anchor="start" fill="#202020" font-weight="normal">6.</text>
<text x="20.00" y="62.00" font-family="sans-serif" font-size="3.30" text-anchor="start" fill="#202020" font-weight="normal">센서를 4대로 늘리려면 단자대를 10극으로 키우거나 분배 단자를 추가한다.</text>
