<text x="398.000" y="375.000" font-family="sans-serif" font-size="6.50" text-anchor="start" fill="#202020" font-weight="bold">하부면 타공도</text>
<text x="398.000" y="390.000" font-family="sans-serif" font-size="4.00" text-anchor="start" fill="#202020" font-weight="normal">Shrimp365 수질 모니터링 장비 함체</text>
<text x="580.000" y="390.000" font-family="sans-serif" font-size="4.00" text-anchor="end" fill="#202020" font-weight="normal">도번 SH-02</text>
<text x="398.000" y="405.000" font-family="sans-serif" font-size="3.60" text-anchor="start" fill="#202020" font-weight="normal">척도 1:1   투상 제3각   단위 mm</text>
<text x="580.000" y="405.000" font-family="sans-serif" font-size="3.60" text-anchor="end" fill="#202020" font-weight="normal">A2 / Rev.A</text>
<text x="16.000" y="26.000" font-family="sans-serif" font-size="4.80" text-anchor="start" fill="#202020" font-weight="bold">주기</text>
<text x="16.000" y="34.000" font-family="sans-serif" font-size="3.40" text-anchor="start" fill="#202020" font-weight="normal">1.</text>
<text x="22.000" y="34.000" font-family="sans-serif" font-size="3.40" text-anchor="start" fill="#202020" font-weight="normal">함체 하부면을 정면도에서 아래로 90° 전개한 모습. 좌우는 정면에서 본 것과 같다.</text>
<text x="16.000" y="39.200" font-family="sans-serif" font-size="3.40" text-anchor="start" fill="#202020" font-weight="normal">2.</text>
<text x="22.000" y="39.200" font-family="sans-serif" font-size="3.40" text-anchor="start" fill="#202020" font-weight="normal">정면에서 보아 좌→우 순서: VENT, pH, DO, EC, SPARE, AC.</text>
<text x="16.000" y="44.400" font-family="sans-serif" font-size="3.40" text-anchor="start" fill="#202020" font-weight="normal">3.</text>
<text x="22.000" y="44.400" font-family="sans-serif" font-size="3.40" text-anchor="start" fill="#202020" font-weight="normal">AC 는 M12 S-coded, 센서는 M12 A-coded 로 코딩이 다르다. 두 계열은 물리적으로</text>
<text x="22.000" y="49.600" font-family="sans-serif" font-size="3.40" text-anchor="start" fill="#202020" font-weight="normal">서로 결합되지 않으므로 AC 를 센서 포트에 꽂는 사고가 원천 차단된다.</text>
<text x="16.000" y="54.800" font-family="sans-serif" font-size="3.40" text-anchor="start" fill="#202020" font-weight="normal">4.</text>
<text x="22.000" y="54.800" font-family="sans-serif" font-size="3.40" text-anchor="start" fill="#202020" font-weight="normal">구멍 지름은 M16x1.5 나사부를 갖는 전면체결형 M12 커넥터 기준이다.</text>
<text x="22.000" y="60.000" font-family="sans-serif" font-size="3.40" text-anchor="start" fill="#202020" font-weight="normal">후면체결형·2점나사형은 치수가 다르다 — 커넥터 확정 후 재확인할 것.</text>
<text x="16.000" y="65.200" font-family="sans-serif" font-size="3.40" text-anchor="start" fill="#202020" font-weight="normal">5.</text>
<text x="22.000" y="65.200" font-family="sans-serif" font-size="3.40" text-anchor="start" fill="#202020" font-weight="normal">커넥터에 회전방지 평면이 있는 제품이면 Ø16.5 에 폭 15.5 평면을 추가한다.</text>
<text x="16.000" y="70.400" font-family="sans-serif" font-size="3.40" text-anchor="start" fill="#202020" font-weight="normal">6.</text>
<text x="22.000" y="70.400" font-family="sans-serif" font-size="3.40" text-anchor="start" fill="#202020" font-weight="normal">Y=100 은 후면 외벽 기준이다. SMPS 깊이(약 56)와 백플레이트 이격을 피해</text>
<text x="22.000" y="75.600" font-family="sans-serif" font-size="3.40" text-anchor="start" fill="#202020" font-weight="normal">커넥터 몸통이 간섭 없이 들어가도록 정한 값이다.</text>
<text x="16.000" y="80.800" font-family="sans-serif" font-size="3.40" text-anchor="start" fill="#202020" font-weight="normal">7.</text>
<text x="22.000" y="80.800" font-family="sans-serif" font-size="3.40" text-anchor="start" fill="#202020" font-weight="normal">커넥터는 전부 하부면에만 둔다. 측면·상부는 물이 고여 방수가 깨진다.</text>
<text x="16.000" y="86.000" font-family="sans-serif" font-size="3.40" text-anchor="start" fill="#202020" font-weight="normal">8.</text>
<text x="22.000" y="86.000" font-family="sans-serif" font-size="3.40" text-anchor="start" fill="#202020" font-weight="normal">타공 후 버를 제거하고 개스킷 접촉면을 평탄하게 다듬는다.</text>
<text x="16.000" y="91.200" font-family="sans-serif" font-size="3.40" text-anchor="start" fill="#202020" font-weight="normal">9.</text>
<text x="22.000" y="91.200" font-family="sans-serif" font-size="3.40" text-anchor="start" fill="#202020" font-weight="normal">미사용 포트(SPARE)에는 방수캡을 씌워 출하한다.</text>
<text x="16.000" y="102.400" font-family="sans-serif" font-size="3.40" text-anchor="start" fill="#202020" font-weight="normal">※ 유선 LAN 은 사용하지 않기로 하여 RJ45 포트를 삭제했다.</text>
<line x1="16.0" y1="398.0" x2="28.0" y2="398.0" stroke="#c00000" stroke-width="0.8"/>
