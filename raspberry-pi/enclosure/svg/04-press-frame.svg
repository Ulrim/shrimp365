<text x="398.000" y="375.000" font-family="sans-serif" font-size="6.50" text-anchor="start" fill="#202020" font-weight="bold">압착 프레임</text>
<text x="398.000" y="390.000" font-family="sans-serif" font-size="4.00" text-anchor="start" fill="#202020" font-weight="normal">Shrimp365 수질 모니터링 장비 함체</text>
<text x="580.000" y="390.000" font-family="sans-serif" font-size="4.00" text-anchor="end" fill="#202020" font-weight="normal">도번 SH-04</text>
<text x="398.000" y="405.000" font-family="sans-serif" font-size="3.60" text-anchor="start" fill="#202020" font-weight="normal">척도 1:1   투상 제3각   단위 mm</text>
<text x="580.000" y="405.000" font-family="sans-serif" font-size="3.60" text-anchor="end" fill="#202020" font-weight="normal">A2 / Rev.A</text>
<text x="16.000" y="26.000" font-family="sans-serif" font-size="4.80" text-anchor="start" fill="#202020" font-weight="bold">주기</text>
<text x="16.000" y="34.000" font-family="sans-serif" font-size="3.40" text-anchor="start" fill="#202020" font-weight="normal">1.</text>
<text x="22.000" y="34.000" font-family="sans-serif" font-size="3.40" text-anchor="start" fill="#202020" font-weight="normal">재질 알루미늄 3t (또는 SUS304 2t). 수량 1/대. 레이저 절단.</text>
<text x="16.000" y="39.200" font-family="sans-serif" font-size="3.40" text-anchor="start" fill="#202020" font-weight="normal">2.</text>
<text x="22.000" y="39.200" font-family="sans-serif" font-size="3.40" text-anchor="start" fill="#202020" font-weight="normal">디스플레이 뒷면 가장자리를 폭 8 의 띠로 눌러 도어 개스킷을 균등 압축한다.</text>
<text x="22.000" y="44.400" font-family="sans-serif" font-size="3.40" text-anchor="start" fill="#202020" font-weight="normal">가로 접촉대 반폭 89~97, 세로 47.5~55.5. 도어 개스킷 밴드(반폭 88~93 /</text>
<text x="22.000" y="49.600" font-family="sans-serif" font-size="3.40" text-anchor="start" fill="#202020" font-weight="normal">47~52)와 겹치므로 압축력이 개스킷 바로 위에 실린다.</text>
<text x="16.000" y="54.800" font-family="sans-serif" font-size="3.40" text-anchor="start" fill="#202020" font-weight="normal">3.</text>
<text x="22.000" y="54.800" font-family="sans-serif" font-size="3.40" text-anchor="start" fill="#202020" font-weight="normal">접촉면에는 두께 3 실리콘 패드를 같은 폭 8 의 액자 모양으로 붙인다.</text>
<text x="22.000" y="60.000" font-family="sans-serif" font-size="3.40" text-anchor="start" fill="#202020" font-weight="normal">디스플레이 뒷면 부품과 직접 닿지 않게 하기 위한 것이다.</text>
<text x="16.000" y="65.200" font-family="sans-serif" font-size="3.40" text-anchor="start" fill="#202020" font-weight="normal">4.</text>
<text x="22.000" y="65.200" font-family="sans-serif" font-size="3.40" text-anchor="start" fill="#202020" font-weight="normal">M3 스탠드오프 4개소에 SUS316 M3 볼트 + 스프링와셔로 체결한다.</text>
<text x="22.000" y="70.400" font-family="sans-serif" font-size="3.40" text-anchor="start" fill="#202020" font-weight="normal">대각선 순서로 조금씩 나눠 조여 개스킷을 고르게 압축한다. 과조임 금지.</text>
<text x="16.000" y="75.600" font-family="sans-serif" font-size="3.40" text-anchor="start" fill="#202020" font-weight="normal">5.</text>
<text x="22.000" y="75.600" font-family="sans-serif" font-size="3.40" text-anchor="start" fill="#202020" font-weight="normal">창 치수는 디스플레이 뒷면의 부품 배치에 따라 달라질 수 있다.</text>
<text x="22.000" y="80.800" font-family="sans-serif" font-size="3.40" text-anchor="start" fill="#202020" font-weight="normal">시제품 실측 후 확정할 것.</text>
<text x="16.000" y="86.000" font-family="sans-serif" font-size="3.40" text-anchor="start" fill="#202020" font-weight="normal">6.</text>
<text x="22.000" y="86.000" font-family="sans-serif" font-size="3.40" text-anchor="start" fill="#202020" font-weight="normal">절단 후 모든 모서리를 면취하고 버를 제거한다. 리본 케이블이 지나간다.</text>
