<text x="196.00" y="204.00" font-family="sans-serif" font-size="3.60" text-anchor="start" fill="#202020" font-weight="bold">M12 A-coded 4핀   1=+24V(빨강)  2=A(초록)  3=0V(검정)  4=B(노랑)</text>
<text x="196.00" y="212.00" font-family="sans-serif" font-size="3.20" text-anchor="start" fill="#555" font-weight="normal">핀 색은 Nengshi 센서 케이블 기준이다. 표준 M12 케이블(갈/백/청/흑)을 쓸 때는 WIRING.md 대응표를 볼 것.</text>
<path d="M 196.00 180.00 L 196.00 232.00 L 120.00 232.00" fill="none" stroke="#2f8f3f" stroke-width="1.00" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="3,2"/>
<rect x="76.00" y="226.00" width="44.00" height="12.00" fill="#f7f7f7" stroke="#202020" stroke-width="0.70" rx="1.5"/>
<text x="98.00" y="233.40" font-family="sans-serif" font-size="4.00" text-anchor="middle" fill="#202020" font-weight="bold">0V-P 단자</text>
<text x="124.00" y="229.00" font-family="sans-serif" font-size="3.20" text-anchor="start" fill="#2f8f3f" font-weight="normal">실드는 함체측 한쪽만 접지 — 양쪽 접지는 접지 루프</text>
<rect x="324.00" y="226.00" width="64.00" height="14.00" fill="#fff0f0" stroke="#c00000" stroke-width="0.70" rx="1.5"/>
<text x="356.00" y="234.40" font-family="sans-serif" font-size="4.00" text-anchor="middle" fill="#202020" font-weight="bold">120Ω 더미 플러그</text>
<path d="M 356.00 180.00 L 356.00 226.00" fill="none" stroke="#202020" stroke-width="0.90" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="3,2"/>
<rect x="244.00" y="259.00" width="168.00" height="30.00" fill="#fff" stroke="#202020" stroke-width="0.6"/>
<line x1="244.00" y1="274.00" x2="412.00" y2="274.00" stroke="#202020" stroke-width="0.4"/>
<text x="247.00" y="269.50" font-family="sans-serif" font-size="6.00" text-anchor="start" fill="#202020" font-weight="bold">RS485 · 센서 계통도</text>
<text x="247.00" y="283.00" font-family="sans-serif" font-size="3.60" text-anchor="start" fill="#202020" font-weight="normal">Shrimp365 수질 모니터링 장비 — 내부 배선</text>
<text x="409.00" y="283.00" font-family="sans-serif" font-size="3.60" text-anchor="end" fill="#202020" font-weight="normal">도번 W-02   Rev.A</text>
<text x="14.00" y="22.00" font-family="sans-serif" font-size="4.60" text-anchor="start" fill="#202020" font-weight="bold">주기</text>
<text x="14.00" y="27.00" font-family="sans-serif" font-size="3.30" text-anchor="start" fill="#202020" font-weight="normal">1.</text>
<text x="20.00" y="27.00" font-family="sans-serif" font-size="3.30" text-anchor="start" fill="#202020" font-weight="normal">센서 4대가 같은 A/B 선에 병렬로 물린다. 슬레이브 ID 는 서로 달라야 한다.</text>
<text x="14.00" y="32.00" font-family="sans-serif" font-size="3.30" text-anchor="start" fill="#202020" font-weight="normal">2.</text>
<text x="20.00" y="32.00" font-family="sans-serif" font-size="3.30" text-anchor="start" fill="#202020" font-weight="normal">변환기의 GND 는 USB 를 통해 0V-S 에 있고, 센서 0V 는 0V-P 에 있다.</text>
<text x="20.00" y="37.00" font-family="sans-serif" font-size="3.30" text-anchor="start" fill="#202020" font-weight="normal">두 계통은 W-01 의 LK1 로 묶인다. LK1 이 없으면 이 회로는 동작하지 않는다.</text>
<text x="14.00" y="42.00" font-family="sans-serif" font-size="3.30" text-anchor="start" fill="#202020" font-weight="normal">3.</text>
<text x="20.00" y="42.00" font-family="sans-serif" font-size="3.30" text-anchor="start" fill="#202020" font-weight="normal">TVS 는 변환기 바로 앞에 둔다. 센서 케이블 수십 미터가 사실상 안테나다.</text>
<text x="14.00" y="47.00" font-family="sans-serif" font-size="3.30" text-anchor="start" fill="#202020" font-weight="normal">4.</text>
<text x="20.00" y="47.00" font-family="sans-serif" font-size="3.30" text-anchor="start" fill="#202020" font-weight="normal">센서 케이블은 실드 트위스트 페어. A/B 를 같은 페어로 꼰다.</text>
<text x="14.00" y="52.00" font-family="sans-serif" font-size="3.30" text-anchor="start" fill="#202020" font-weight="normal">5.</text>
<text x="20.00" y="52.00" font-family="sans-serif" font-size="3.30" text-anchor="start" fill="#202020" font-weight="normal">실드는 함체측 0V-P 한쪽에만 접지한다. 양쪽 접지는 접지 루프를 만든다.</text>
<text x="14.00" y="57.00" font-family="sans-serif" font-size="3.30" text-anchor="start" fill="#202020" font-weight="normal">6.</text>
<text x="20.00" y="57.00" font-family="sans-serif" font-size="3.30" text-anchor="start" fill="#202020" font-weight="normal">종단저항 120Ω 은 케이블이 10m 를 넘을 때만 예비 포트에 더미 플러그로 꽂는다.</text>
<text x="20.00" y="62.00" font-family="sans-serif" font-size="3.30" text-anchor="start" fill="#202020" font-weight="normal">함체를 열지 않고 넣고 뺄 수 있어야 하므로 내부 점퍼로 만들지 않는다.</text>
<text x="14.00" y="67.00" font-family="sans-serif" font-size="3.30" text-anchor="start" fill="#202020" font-weight="normal">7.</text>
<text x="20.00" y="67.00" font-family="sans-serif" font-size="3.30" text-anchor="start" fill="#202020" font-weight="normal">RS485 배선은 AC·SMPS 배선에서 50 이상 띄우고, 교차할 때는 직각으로 지난다.</text>
<line x1="14.00" y1="283.00" x2="23.00" y2="283.00" stroke="#c00000" stroke-width="1.4"/>
<text x="25.00" y="284.20" font-family="sans-serif" font-size="3.20" text-anchor="start" fill="#202020" font-weight="normal">+24V</text>
<line x1="37.00" y1="283.00" x2="46.00" y2="283.00" stroke="#202020" stroke-width="1.4"/>
<text x="48.00" y="284.20" font-family="sans-serif" font-size="3.20" text-anchor="start" fill="#202020" font-weight="normal">0V-P</text>
