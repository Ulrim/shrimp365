<text x="71.00" y="284.20" font-family="sans-serif" font-size="3.20" text-anchor="start" fill="#202020" font-weight="normal">RS485 A</text>
<line x1="89.00" y1="283.00" x2="98.00" y2="283.00" stroke="#b89000" stroke-width="1.4"/>
<text x="100.00" y="284.20" font-family="sans-serif" font-size="3.20" text-anchor="start" fill="#202020" font-weight="normal">RS485 B</text>
<line x1="118.00" y1="283.00" x2="127.00" y2="283.00" stroke="#2f8f3f" stroke-width="1.4"/>
<text x="129.00" y="284.20" font-family="sans-serif" font-size="3.20" text-anchor="start" fill="#202020" font-weight="normal">실드/PE</text>
