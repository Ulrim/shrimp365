<text x="52.00" y="270.00" font-family="sans-serif" font-size="4.00" text-anchor="start" fill="#202020" font-weight="bold">M12 A-coded 4핀   1 = +12V(빨강)   2 = A(초록)   3 = 0V(검정)   4 = B(노랑)</text>
<text x="52.00" y="277.00" font-family="sans-serif" font-size="3.20" text-anchor="start" fill="#555" font-weight="normal">핀 색은 Nengshi 센서 케이블 기준. 표준 M12 케이블(갈/백/청/흑)은 WIRING.md 대응표를 볼 것.</text>
<text x="52.00" y="286.00" font-family="sans-serif" font-size="3.60" text-anchor="start" fill="#c00000" font-weight="bold">★ 변환기 GND → 단자대 8극 → 5극(0V) 본딩이 없으면 이 회로는 동작하지 않는다.</text>
<rect x="244.00" y="259.00" width="168.00" height="30.00" fill="#fff" stroke="#202020" stroke-width="0.6"/>
<line x1="244.00" y1="274.00" x2="412.00" y2="274.00" stroke="#202020" stroke-width="0.4"/>
<text x="247.00" y="269.50" font-family="sans-serif" font-size="6.00" text-anchor="start" fill="#202020" font-weight="bold">RS485 · 센서 계통도</text>
<text x="247.00" y="283.00" font-family="sans-serif" font-size="3.60" text-anchor="start" fill="#202020" font-weight="normal">Shrimp365 수질 모니터링 장비 — 내부 배선</text>
<text x="409.00" y="283.00" font-family="sans-serif" font-size="3.60" text-anchor="end" fill="#202020" font-weight="normal">도번 W-02   Rev.A</text>
<text x="14.00" y="22.00" font-family="sans-serif" font-size="4.60" text-anchor="start" fill="#202020" font-weight="bold">주기</text>
<text x="14.00" y="27.00" font-family="sans-serif" font-size="3.30" text-anchor="start" fill="#202020" font-weight="normal">1.</text>
<text x="20.00" y="27.00" font-family="sans-serif" font-size="3.30" text-anchor="start" fill="#202020" font-weight="normal">센서 3대가 같은 A/B 선에 병렬로 물린다. 슬레이브 ID 는 서로 달라야 한다.</text>
<text x="14.00" y="32.00" font-family="sans-serif" font-size="3.30" text-anchor="start" fill="#202020" font-weight="normal">2.</text>
<text x="20.00" y="32.00" font-family="sans-serif" font-size="3.30" text-anchor="start" fill="#202020" font-weight="normal">변환기는 파이 USB 로 급전되므로 그 GND 는 파이 어댑터 계통에 있고,</text>
<text x="20.00" y="37.00" font-family="sans-serif" font-size="3.30" text-anchor="start" fill="#202020" font-weight="normal">센서 0V 는 SMPS 계통에 있다. 두 계통은 단자대 8극 본딩으로만 만난다.</text>
<text x="14.00" y="42.00" font-family="sans-serif" font-size="3.30" text-anchor="start" fill="#202020" font-weight="normal">3.</text>
<text x="20.00" y="42.00" font-family="sans-serif" font-size="3.30" text-anchor="start" fill="#202020" font-weight="normal">TVS 는 변환기 바로 앞에 둔다.</text>
<text x="14.00" y="47.00" font-family="sans-serif" font-size="3.30" text-anchor="start" fill="#202020" font-weight="normal">4.</text>
<text x="20.00" y="47.00" font-family="sans-serif" font-size="3.30" text-anchor="start" fill="#202020" font-weight="normal">센서 케이블은 실드 트위스트 페어. A/B 를 같은 페어로 꼰다.</text>
<text x="14.00" y="52.00" font-family="sans-serif" font-size="3.30" text-anchor="start" fill="#202020" font-weight="normal">5.</text>
<text x="20.00" y="52.00" font-family="sans-serif" font-size="3.30" text-anchor="start" fill="#202020" font-weight="normal">실드는 함체측 0V(5극) 한쪽에만 접지한다. 센서측은 띄운다.</text>
<text x="14.00" y="57.00" font-family="sans-serif" font-size="3.30" text-anchor="start" fill="#202020" font-weight="normal">6.</text>
<text x="20.00" y="57.00" font-family="sans-serif" font-size="3.30" text-anchor="start" fill="#202020" font-weight="normal">종단저항 120Ω 은 케이블이 10m 를 넘을 때만 A–B 사이에 넣는다.</text>
<text x="14.00" y="62.00" font-family="sans-serif" font-size="3.30" text-anchor="start" fill="#202020" font-weight="normal">7.</text>
<text x="20.00" y="62.00" font-family="sans-serif" font-size="3.30" text-anchor="start" fill="#202020" font-weight="normal">RS485 배선은 AC·SMPS 배선에서 50 이상 띄우고, 교차할 때는 직각으로 지난다.</text>
<line x1="14.00" y1="283.00" x2="23.00" y2="283.00" stroke="#c00000" stroke-width="1.4"/>
<text x="25.00" y="284.20" font-family="sans-serif" font-size="3.20" text-anchor="start" fill="#202020" font-weight="normal">+12V</text>
<line x1="37.00" y1="283.00" x2="46.00" y2="283.00" stroke="#202020" stroke-width="1.4"/>
<text x="48.00" y="284.20" font-family="sans-serif" font-size="3.20" text-anchor="start" fill="#202020" font-weight="normal">0V</text>
