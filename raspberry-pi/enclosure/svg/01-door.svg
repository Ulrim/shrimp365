<text x="519.500" y="73.000" font-family="sans-serif" font-size="3.00" text-anchor="start" fill="#0070a0" font-weight="normal">M3 스탠드오프 Ø8 접착</text>
<rect x="394.0" y="364.0" width="190.0" height="46.0" fill="#ffffff" stroke="#202020" stroke-width="0.7"/>
<line x1="394.0" y1="380.0" x2="584.0" y2="380.0" stroke="#202020" stroke-width="0.4"/>
<line x1="394.0" y1="395.0" x2="584.0" y2="395.0" stroke="#202020" stroke-width="0.4"/>
<text x="398.000" y="375.000" font-family="sans-serif" font-size="6.50" text-anchor="start" fill="#202020" font-weight="bold">도어 가공도</text>
<text x="398.000" y="390.000" font-family="sans-serif" font-size="4.00" text-anchor="start" fill="#202020" font-weight="normal">Shrimp365 수질 모니터링 장비 함체</text>
<text x="580.000" y="390.000" font-family="sans-serif" font-size="4.00" text-anchor="end" fill="#202020" font-weight="normal">도번 SH-01</text>
<text x="398.000" y="405.000" font-family="sans-serif" font-size="3.60" text-anchor="start" fill="#202020" font-weight="normal">척도 1:1   투상 제3각   단위 mm</text>
<text x="580.000" y="405.000" font-family="sans-serif" font-size="3.60" text-anchor="end" fill="#202020" font-weight="normal">A2 / Rev.A</text>
<text x="16.000" y="26.000" font-family="sans-serif" font-size="4.80" text-anchor="start" fill="#202020" font-weight="bold">주기</text>
<text x="16.000" y="34.000" font-family="sans-serif" font-size="3.40" text-anchor="start" fill="#202020" font-weight="normal">1.</text>
<text x="22.000" y="34.000" font-family="sans-serif" font-size="3.40" text-anchor="start" fill="#202020" font-weight="normal">도어를 바깥에서 본 모습. 개구부는 상하좌우 대칭이므로 안팎 좌표가 같다.</text>
<text x="16.000" y="39.200" font-family="sans-serif" font-size="3.40" text-anchor="start" fill="#202020" font-weight="normal">2.</text>
<text x="22.000" y="39.200" font-family="sans-serif" font-size="3.40" text-anchor="start" fill="#202020" font-weight="normal">절삭 가공은 개구부 176 x 94, R3 하나뿐이다. 나머지는 위치 마킹이다.</text>
<text x="16.000" y="44.400" font-family="sans-serif" font-size="3.40" text-anchor="start" fill="#202020" font-weight="normal">3.</text>
<text x="22.000" y="44.400" font-family="sans-serif" font-size="3.40" text-anchor="start" fill="#202020" font-weight="normal">개구부 절단면의 버를 제거하고 모서리를 0.5 C 로 면취한다.</text>
<text x="16.000" y="49.600" font-family="sans-serif" font-size="3.40" text-anchor="start" fill="#202020" font-weight="normal">4.</text>
<text x="22.000" y="49.600" font-family="sans-serif" font-size="3.40" text-anchor="start" fill="#202020" font-weight="normal">스탠드오프는 도어 안쪽면에 2액형 에폭시로 접착한다. 도어 벽두께가 4mm</text>
<text x="22.000" y="54.800" font-family="sans-serif" font-size="3.40" text-anchor="start" fill="#202020" font-weight="normal">이상이면 M3 열간압입 인서트(하부구멍 Ø4.0 x 깊이 4.0)로 대체해도 된다.</text>
<text x="16.000" y="60.000" font-family="sans-serif" font-size="3.40" text-anchor="start" fill="#202020" font-weight="normal">5.</text>
<text x="22.000" y="60.000" font-family="sans-serif" font-size="3.40" text-anchor="start" fill="#202020" font-weight="normal">개스킷: 폭 5, 두께 2 폴리우레탄 폼 양면테이프. 개구부 가장자리에 맞춰</text>
<text x="22.000" y="65.200" font-family="sans-serif" font-size="3.40" text-anchor="start" fill="#202020" font-weight="normal">끊김 없이 한 바퀴 두른다. 모서리에서 잇지 말 것.</text>
<text x="16.000" y="70.400" font-family="sans-serif" font-size="3.40" text-anchor="start" fill="#202020" font-weight="normal">6.</text>
<text x="22.000" y="70.400" font-family="sans-serif" font-size="3.40" text-anchor="start" fill="#202020" font-weight="normal">디스플레이 유리(194x111)와 개스킷 바깥선(186x104) 사이 여유는 편측 4.0 /</text>
<text x="22.000" y="75.600" font-family="sans-serif" font-size="3.40" text-anchor="start" fill="#202020" font-weight="normal">3.5 이다. 유리 뒷면 가장자리에 단차가 있으면 개스킷이 뜬다 — 시제품</text>
<text x="22.000" y="80.800" font-family="sans-serif" font-size="3.40" text-anchor="start" fill="#202020" font-weight="normal">1대로 실측 확인한 뒤 양산 도면을 확정할 것.</text>
<text x="16.000" y="86.000" font-family="sans-serif" font-size="3.40" text-anchor="start" fill="#202020" font-weight="normal">7.</text>
<text x="22.000" y="86.000" font-family="sans-serif" font-size="3.40" text-anchor="start" fill="#202020" font-weight="normal">도어 바깥면에 노출되는 나사는 없어야 한다.</text>
<text x="16.000" y="97.200" font-family="sans-serif" font-size="3.40" text-anchor="start" fill="#202020" font-weight="normal">※ 함체 외곽 300x300 과 평탄부 265x265 은 기성 함체 카탈로그값이다.</text>
<text x="16.000" y="102.200" font-family="sans-serif" font-size="3.40" text-anchor="start" fill="#202020" font-weight="normal">   구매 확정 후 실측하여 PARAMS 를 갱신하고 도면을 다시 생성할 것.</text>
<line x1="16.0" y1="398.0" x2="28.0" y2="398.0" stroke="#c00000" stroke-width="0.8"/>
<text x="30.000" y="399.400" font-family="sans-serif" font-size="3.40" text-anchor="start" fill="#202020" font-weight="normal">가공 CUT</text>
<line x1="62.0" y1="398.0" x2="74.0" y2="398.0" stroke="#008000" stroke-width="0.8"/>
<text x="76.000" y="399.400" font-family="sans-serif" font-size="3.40" text-anchor="start" fill="#202020" font-weight="normal">마킹 MARK</text>
<line x1="108.0" y1="398.0" x2="120.0" y2="398.0" stroke="#909090" stroke-width="0.8"/>
<text x="122.000" y="399.400" font-family="sans-serif" font-size="3.40" text-anchor="start" fill="#202020" font-weight="normal">참고 REF</text>
</svg>
