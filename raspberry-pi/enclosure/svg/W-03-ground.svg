<circle cx="230.00" cy="235.00" r="1.30" fill="#8a8a8a"/>
<text x="24.00" y="268.00" font-family="sans-serif" font-size="4.20" text-anchor="start" fill="#c00000" font-weight="bold">본딩 확인 3항목 — ① X1 PE ↔ 백플레이트 &lt; 0.1Ω   ② 0V-P ↔ 0V-S 도통 (LK1)   ③ 0V-P ↔ PE 도통 (LK2)</text>
<rect x="244.00" y="259.00" width="168.00" height="30.00" fill="#fff" stroke="#202020" stroke-width="0.6"/>
<line x1="244.00" y1="274.00" x2="412.00" y2="274.00" stroke="#202020" stroke-width="0.4"/>
<text x="247.00" y="269.50" font-family="sans-serif" font-size="6.00" text-anchor="start" fill="#202020" font-weight="bold">접지 · 본딩 계통도</text>
<text x="247.00" y="283.00" font-family="sans-serif" font-size="3.60" text-anchor="start" fill="#202020" font-weight="normal">Shrimp365 수질 모니터링 장비 — 내부 배선</text>
<text x="409.00" y="283.00" font-family="sans-serif" font-size="3.60" text-anchor="end" fill="#202020" font-weight="normal">도번 W-03   Rev.A</text>
<text x="14.00" y="22.00" font-family="sans-serif" font-size="4.60" text-anchor="start" fill="#202020" font-weight="bold">주기</text>
<text x="14.00" y="27.00" font-family="sans-serif" font-size="3.30" text-anchor="start" fill="#202020" font-weight="normal">1.</text>
<text x="20.00" y="27.00" font-family="sans-serif" font-size="3.30" text-anchor="start" fill="#202020" font-weight="normal">PE 는 AC 커넥터에서 받아 백플레이트 접지 스터드 한 점에 모은다.</text>
<text x="20.00" y="32.00" font-family="sans-serif" font-size="3.30" text-anchor="start" fill="#202020" font-weight="normal">HDR-60-24 는 클래스 II 라 FG 단자가 없다. PE 는 SMPS 를 거치지 않는다.</text>
<text x="14.00" y="37.00" font-family="sans-serif" font-size="3.30" text-anchor="start" fill="#202020" font-weight="normal">2.</text>
<text x="20.00" y="37.00" font-family="sans-serif" font-size="3.30" text-anchor="start" fill="#202020" font-weight="normal">백플레이트가 알루미늄이므로 반드시 PE 에 본딩한다. 방열 경로이면서 금속</text>
<text x="20.00" y="42.00" font-family="sans-serif" font-size="3.30" text-anchor="start" fill="#202020" font-weight="normal">노출부이기도 하다. 톱니와셔로 도장·산화막을 관통시킬 것.</text>
<text x="14.00" y="47.00" font-family="sans-serif" font-size="3.30" text-anchor="start" fill="#202020" font-weight="normal">3.</text>
<text x="20.00" y="47.00" font-family="sans-serif" font-size="3.30" text-anchor="start" fill="#202020" font-weight="normal">LK1 (0V-P ↔ 0V-S) 은 필수다. DDR-30G-5 가 절연형이라 이것이 없으면 두 계통의</text>
<text x="20.00" y="52.00" font-family="sans-serif" font-size="3.30" text-anchor="start" fill="#202020" font-weight="normal">기준이 떠서 RS485 가 간헐적으로 끊긴다.</text>
<text x="14.00" y="57.00" font-family="sans-serif" font-size="3.30" text-anchor="start" fill="#202020" font-weight="normal">4.</text>
<text x="20.00" y="57.00" font-family="sans-serif" font-size="3.30" text-anchor="start" fill="#202020" font-weight="normal">LK2 (0V-P ↔ PE) 는 기본 장착이다. SELV 계통에 기준을 주고 서지를 PE 로 뺀다.</text>
<text x="20.00" y="62.00" font-family="sans-serif" font-size="3.30" text-anchor="start" fill="#202020" font-weight="normal">접지 루프가 의심되면 분리해 시험할 수 있다.</text>
<text x="14.00" y="67.00" font-family="sans-serif" font-size="3.30" text-anchor="start" fill="#202020" font-weight="normal">5.</text>
<text x="20.00" y="67.00" font-family="sans-serif" font-size="3.30" text-anchor="start" fill="#202020" font-weight="normal">케이블 실드는 함체측 0V-P 한쪽에만 붙인다. 센서측은 띄운다.</text>
<line x1="14.00" y1="283.00" x2="23.00" y2="283.00" stroke="#2f8f3f" stroke-width="1.4"/>
<text x="25.00" y="284.20" font-family="sans-serif" font-size="3.20" text-anchor="start" fill="#202020" font-weight="normal">PE</text>
<line x1="33.00" y1="283.00" x2="42.00" y2="283.00" stroke="#202020" stroke-width="1.4"/>
<text x="44.00" y="284.20" font-family="sans-serif" font-size="3.20" text-anchor="start" fill="#202020" font-weight="normal">0V-P</text>
<line x1="56.00" y1="283.00" x2="65.00" y2="283.00" stroke="#8a8a8a" stroke-width="1.4"/>
<text x="67.00" y="284.20" font-family="sans-serif" font-size="3.20" text-anchor="start" fill="#202020" font-weight="normal">0V-S</text>
</svg>
