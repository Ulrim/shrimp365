<circle cx="70.00" cy="107.00" r="1.30" fill="#2f8f3f"/>
<text x="20.00" y="62.00" font-family="sans-serif" font-size="4.00" text-anchor="start" fill="#c00000" font-weight="bold">파이 어댑터는 대개 2핀이라 접지가 없다. 파이 계통이 PE 와 만나는 곳은</text>
<text x="20.00" y="69.00" font-family="sans-serif" font-size="4.00" text-anchor="start" fill="#c00000" font-weight="bold">이 본딩선 하나뿐이다.</text>
<rect x="244.00" y="259.00" width="168.00" height="30.00" fill="#fff" stroke="#202020" stroke-width="0.6"/>
<line x1="244.00" y1="274.00" x2="412.00" y2="274.00" stroke="#202020" stroke-width="0.4"/>
<text x="247.00" y="269.50" font-family="sans-serif" font-size="6.00" text-anchor="start" fill="#202020" font-weight="bold">접지 · 본딩 계통도</text>
<text x="247.00" y="283.00" font-family="sans-serif" font-size="3.60" text-anchor="start" fill="#202020" font-weight="normal">Shrimp365 수질 모니터링 장비 — 내부 배선</text>
<text x="409.00" y="283.00" font-family="sans-serif" font-size="3.60" text-anchor="end" fill="#202020" font-weight="normal">도번 W-03   Rev.A</text>
<text x="14.00" y="22.00" font-family="sans-serif" font-size="4.60" text-anchor="start" fill="#202020" font-weight="bold">주기</text>
<text x="14.00" y="27.00" font-family="sans-serif" font-size="3.30" text-anchor="start" fill="#202020" font-weight="normal">1.</text>
<text x="20.00" y="27.00" font-family="sans-serif" font-size="3.30" text-anchor="start" fill="#202020" font-weight="normal">PE 는 AC 인입에서 단자대 3극을 거쳐 접지 스터드 한 점에 모은다.</text>
<text x="14.00" y="32.00" font-family="sans-serif" font-size="3.30" text-anchor="start" fill="#202020" font-weight="normal">2.</text>
<text x="20.00" y="32.00" font-family="sans-serif" font-size="3.30" text-anchor="start" fill="#202020" font-weight="normal">백플레이트가 알루미늄이면 반드시 PE 에 본딩한다. 톱니와셔로 산화막을 관통시킬 것.</text>
<text x="14.00" y="37.00" font-family="sans-serif" font-size="3.30" text-anchor="start" fill="#202020" font-weight="normal">3.</text>
<text x="20.00" y="37.00" font-family="sans-serif" font-size="3.30" text-anchor="start" fill="#202020" font-weight="normal">콘센트의 접지극도 PE 에 문다. 어댑터가 3핀이면 이 경로로 파이 섀시가 접지된다.</text>
<text x="14.00" y="42.00" font-family="sans-serif" font-size="3.30" text-anchor="start" fill="#202020" font-weight="normal">4.</text>
<text x="20.00" y="42.00" font-family="sans-serif" font-size="3.30" text-anchor="start" fill="#202020" font-weight="normal">★ 5–8 점퍼와 변환기 GND 배선이 이 장비의 필수 본딩이다.</text>
<text x="20.00" y="47.00" font-family="sans-serif" font-size="3.30" text-anchor="start" fill="#202020" font-weight="normal">파이 어댑터와 SMPS 는 서로 절연된 별개 전원이라 이것 말고는 만나는 곳이 없다.</text>
<text x="20.00" y="52.00" font-family="sans-serif" font-size="3.30" text-anchor="start" fill="#202020" font-weight="normal">빠지면 RS485 공통모드가 벗어나 간헐적 CRC 오류가 난다.</text>
<text x="14.00" y="57.00" font-family="sans-serif" font-size="3.30" text-anchor="start" fill="#202020" font-weight="normal">5.</text>
<text x="20.00" y="57.00" font-family="sans-serif" font-size="3.30" text-anchor="start" fill="#202020" font-weight="normal">LK2 (0V ↔ PE) 는 선택이다. SELV 계통에 기준을 주고 서지를 PE 로 뺀다.</text>
<text x="20.00" y="62.00" font-family="sans-serif" font-size="3.30" text-anchor="start" fill="#202020" font-weight="normal">접지 루프가 의심되면 분리해 시험한다.</text>
<text x="14.00" y="67.00" font-family="sans-serif" font-size="3.30" text-anchor="start" fill="#202020" font-weight="normal">6.</text>
<text x="20.00" y="67.00" font-family="sans-serif" font-size="3.30" text-anchor="start" fill="#202020" font-weight="normal">케이블 실드는 함체측 0V 한쪽에만 붙인다.</text>
<line x1="14.00" y1="283.00" x2="23.00" y2="283.00" stroke="#2f8f3f" stroke-width="1.4"/>
<text x="25.00" y="284.20" font-family="sans-serif" font-size="3.20" text-anchor="start" fill="#202020" font-weight="normal">PE</text>
<line x1="33.00" y1="283.00" x2="42.00" y2="283.00" stroke="#202020" stroke-width="1.4"/>
<text x="44.00" y="284.20" font-family="sans-serif" font-size="3.20" text-anchor="start" fill="#202020" font-weight="normal">0V</text>
<line x1="52.00" y1="283.00" x2="61.00" y2="283.00" stroke="#8a8a8a" stroke-width="1.4"/>
<text x="63.00" y="284.20" font-family="sans-serif" font-size="3.20" text-anchor="start" fill="#202020" font-weight="normal">본딩·파이 GND</text>
