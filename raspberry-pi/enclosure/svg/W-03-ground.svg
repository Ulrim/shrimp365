<text x="311.00" y="244.40" font-family="sans-serif" font-size="4.00" text-anchor="middle" fill="#202020" font-weight="bold">USB-RS485 GND</text>
<rect x="276.00" y="262.00" width="70.00" height="22.00" fill="#f0f4ff" stroke="#202020" stroke-width="0.70" rx="1.5"/>
