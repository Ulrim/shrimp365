; Shrimp365 수질 모니터링 프로그램 설정
; 이 파일을 /etc/shrimp365/config.ini 로 복사한 뒤 값을 채우세요.
;   sudo mkdir -p /etc/shrimp365
;   sudo cp config.example.ini /etc/shrimp365/config.ini
;   sudo chmod 600 /etc/shrimp365/config.ini      ← 기기 키가 들어가므로 권한을 좁힙니다

[device]
;;; 운전 모드 — 이 장비가 무엇을 하는 기계인가. 세 모드는 **상호 배타**입니다.
;
;   aquaculture  양식장    수질 측정이 본업입니다(기본값).
;   smartfarm    스마트팜  수경재배. EC 로 양액 농도를 보고 보충량을 띄웁니다.
;   mrv          탄소 MRV  기계실 계량기 옆 전력 수기 입력 단말.
;
; 장비 화면 [설정] → [운전 모드] 에서 바꿀 수 있고, 여기에 자동으로 저장됩니다.
;
; 이 항목이 **없으면** 기존 설치로 보고 [nutrient] enabled 로 추론합니다
;   (켜져 있으면 smartfarm, 꺼져 있으면 aquaculture).
; 추론으로 mrv 가 되는 길은 없습니다 — 수질을 보던 장비의 기본 화면이 어느 날
; 전력 입력 단말로 바뀌면 안 되므로, mrv 는 사람이 고를 때만 됩니다.
;
; mrv 로 두면
;   · 기본 화면이 전력 입력 단말이 됩니다(마지막 지침·오늘 보낸 건수·미전송 건수).
;   · 수질 측정 칸은 [sensors] 에 켜진 센서가 있을 때만 보입니다. 하나도 없으면
;     '--' 로 채우지 않고 아예 숨깁니다 — 기계실 단말에는 센서가 없을 수 있습니다.
;   · 양액 안내와 설비 운전 권고는 끕니다.
;   · **수질 수집·전송은 그대로 계속됩니다.** 끄는 것은 화면이지 수집이 아닙니다.
mode = aquaculture

[server]
endpoint = https://www.shrimp365.kr/api/sensors/data

;;; 기기 키 — 두 가지 방법 중 하나를 쓰세요.
;
; [방법 1] 코드로 연결 (권장)
;   아래 device_key 를 비워 두고 실행하면, 기기가 6자리 코드를 화면에 띄웁니다.
;   Shrimp365 에 로그인 → 양식장·수조 관리 → 수조의 "센서 기기"
;   → "코드로 기기 연결" 에서 그 코드를 입력하면 자동으로 연결됩니다.
;   연결되면 이 파일에 키가 자동으로 저장됩니다.
;
; [방법 2] 키를 직접 붙여넣기
;   같은 화면의 "기기 등록" 으로 발급받은 키를 아래에 적습니다.
;   키는 발급 직후 한 번만 표시됩니다.
device_key =

; 측정 주기(초). 60 = 1분.
; 서버는 기기당 분당 60회로 제한하므로 60초보다 짧게는 권하지 않습니다.
; 수질은 급변하는 값이 아니라서 1분이면 새벽 용존산소 급락도 놓치지 않습니다.
interval_seconds = 60

[serial]
; USB-RS485 어댑터를 쓰면 보통 /dev/ttyUSB0
; 라즈베리파이 GPIO UART 를 쓰면 /dev/ttyAMA0 또는 /dev/serial0
port = /dev/ttyUSB0
baudrate = 9600

[sensors]
; 센서를 연결하지 않았다면 false 로 두세요.
; 슬레이브 ID 는 센서 출고 기본값입니다. 같은 선에 같은 ID 가 둘 있으면 충돌합니다.
ph_enabled = true
ph_slave_id = 1

do_enabled = true
do_slave_id = 3

; EC/TDS/염도 센서 — 전도도를 읽고, 염도는 여기서 환산합니다.
ec_enabled = true
ec_slave_id = 4

; 유량 센서(L/min) — 수경재배 순환 라인 감시용. 새우 양식에는 쓰지 않으므로
; 기본 꺼짐입니다. 슬레이브 ID·레지스터 배치는 하드웨어 스펙 확정 후
; 실제 값으로 맞추세요(현재는 같은 프로토콜 계열을 가정한 잠정값).
flow_enabled = false
flow_slave_id = 5

; 차압 센서(kPa) — UV 살균기·필터 막힘 감시용. 상승하면 막힘을 의심합니다.
; 역시 기본 꺼짐이며 스펙 확정 후 켜세요.
dp_enabled = false
dp_slave_id = 6

; 염도는 센서의 염도 레지스터를 쓰지 않고 전도도에서 환산합니다.
; 실제로 재는 값이 전도도라 그쪽이 믿을 만하기 때문입니다.
;
; 해수 구간(2 ppt 이상)에서는 해양학 표준인 실용염분식(PSS-78)을 씁니다.
; 수온까지 넣어 계산하므로 계수를 곱하는 방식보다 정확합니다 — 여름·겨울에
; 같은 물의 전도도가 달라지는 것까지 반영됩니다. 이 구간에서는 아래 계수를
; 쓰지 않으므로 건드릴 필요가 없습니다.
;
; 아래 계수는 실용염분식이 다루지 못하는 2 ppt 미만(민물·기수 초입)에서만
; 씁니다. TDS 계측기 관례대로 ppm 기준 계수이며, 결과는 ppt 로 바꿔 씁니다.
;   염도(ppt) = 전도도(uS/cm) x 계수 / 1000
ec_to_ppm = 0.5

; EC 센서로 무엇을 잴지 고릅니다. 장비 화면 [설정] → [센서 설정] 에서도 바꿉니다.
;   salinity      염도(‰) — 해수 양식 기본값. 전도도에서 환산해 씁니다.
;   conductivity  전도도(EC) — 양액·민물처럼 EC 자체가 중요한 곳에서 씁니다.
; conductivity 로 두면 염도 환산을 하지 않고 EC 를 그대로 보여 주고 보냅니다.
ec_mode = salinity

; 전도도를 어떤 단위로 보여 줄지 (ec_mode = conductivity 일 때만 씁니다).
;   us   uS/cm  — 바닷물이 약 50,000
;   ms   mS/cm  — 양액에서 흔히 쓰는 단위. 1 mS/cm = 1,000 uS/cm
ec_unit = us

[calibration]
; 센서값 보정 — 휴대용 측정기와 값이 어긋날 때 그 차이만큼 더해 준다.
; 장비 화면 [설정] → [보정 설정] 에서 실측값을 넣으면 자동으로 계산돼 여기 저장된다.
;
; 보정값 = 센서가 읽은 값 + offset
; 1점 보정이라 측정 범위 전체를 맞추지는 못한다. 전극 자체의 보정(영점·기울기)을
; 대신하지 않으며, 어긋남이 크면 전극을 먼저 손보는 편이 옳다.
;
; 0 이면 보정하지 않는다(기본값).
temperature_offset = 0
ph_offset = 0
do_level_offset = 0
conductivity_offset = 0

[nutrient]
; 양액(수경재배) 관리 — EC 로 양액 농도를 보고 보충량을 계산해 화면에 띄운다.
; 장비 화면 [설정] → [양액 설정] 에서 모두 바꿀 수 있고, 여기에 저장된다.
; 새우 양식에는 쓰지 않으므로 기본값은 꺼짐이다.
enabled = false

; 목표 EC (mS/cm) — 정상 운전 시 맞추려는 값
target_ec = 1.8

; 원수 EC (mS/cm) — 양액을 넣기 전 물 자체의 EC
source_ec = 0.3

; 양액 탱크 유효용량 (L) — 실제 순환하는 양액 부피
tank_liters = 1000

;;; 현장 교정값 — 아래 세 값이 보충량 계산의 정확도를 좌우한다.
; "원액 얼마를 넣으면 EC 가 얼마나 오르는가" 를 실제로 재서 넣는다.
;   1) 시험 수조에 원수를 cal_liters 만큼 담고 EC 를 잰다
;   2) A/B 원액을 운전 비율대로 합계 cal_ml 만큼 넣고 충분히 섞는다
;   3) 안정된 뒤 EC 를 다시 재어 오른 폭을 cal_ec_rise 에 적는다 (3회 평균 권장)
; 실증하지 않은 기본값 그대로 쓰면 보충량이 실제와 다를 수 있다.
cal_ml = 10
cal_liters = 100
cal_ec_rise = 0.05

; A/B 원액 총량 중 A액이 차지하는 비율 (%)
a_ratio = 50

; 수온으로 25℃ 기준 보정(ATC)을 할지.
; 센서가 스스로 보정하는 모델이면 false 로 두어 이중 보정을 피한다.
atc = true

[display]
; LCD 화면. 안 붙였으면 none.
;   none     화면 없음
;   console  터미널 출력 (배선 전 확인용)
;   i2c_lcd  I2C 문자 LCD (1602 / 2004)
type = none

; 1602 이면 columns=16, rows=2 / 2004 이면 columns=20, rows=4
columns = 16
rows = 2

; i2cdetect -y 1 로 확인한 주소. 보통 0x27 또는 0x3F
i2c_bus = 1
i2c_address = 0x27

; 값이 화면에 다 안 들어갈 때 몇 초마다 넘길지 (1602 에서 주로 필요)
page_seconds = 5

[webui]
; 라즈베리파이 화면(공식 7인치 터치스크린 등)에 띄우는 상태 페이지.
;   · 기본 화면은 수온·pH·DO·염도. 값 칸을 누르면 그래프가 열립니다.
;   · 오른쪽 아래 "기기 연결" 버튼을 누르면 6자리 코드가 뜹니다.
;
; 기본값은 켬입니다. 127.0.0.1 에만 열려 외부에서는 접근할 수 없으므로
; 화면이 없는 장비에서도 해가 없고, 나중에 화면을 붙였을 때 그대로 쓸 수 있습니다.
; 파이에서 직접 볼 때는 브라우저로 http://127.0.0.1:8080
enabled = true
port = 8080

; 화면 언어. 웹페이지와 같은 4종을 지원합니다.
;   ko 한국어 · en English · vi Tiếng Việt · id Bahasa Indonesia
; 화면의 [설정] → [언어 설정] 에서 바꿀 수 있고, 여기에도 자동으로 저장됩니다.
language = ko

[buffer]
; 인터넷이 끊긴 동안 측정값을 라즈베리파이에 저장해 두었다가,
; 연결이 돌아오면 끊겼던 시점부터 순서대로 다시 올립니다.
; 계정에 연결하기 전에 측정한 값도 함께 보관됩니다.
enabled = true
path = /var/lib/shrimp365/queue.db

; 보관 상한(건). 1분 간격이면 43200건이 약 30일치입니다(약 10MB).
; 넘으면 가장 오래된 것부터 버립니다 — 디스크가 가득 차는 편이 더 나쁩니다.
max_rows = 43200

; 한 번에 몇 건씩 밀린 값을 올릴지.
; 서버가 기기당 분당 60회로 제한하므로 한꺼번에 쏟아부으면 막힙니다.
; 40 이면 실제 시간의 40배 속도로 따라잡습니다 — 하루치 밀린 것이 약 36분.
flush_batch = 40

[mrv]
; 탄소 MRV 전력 수기 입력 — 기계실 화면에서 계량기 지침을 바로 넣습니다.
;
; 전력(kWh)은 사람이 계량기를 읽어 넣습니다. 지금까지는 사무실 PC 웹 화면밖에
; 입력 창구가 없어, 기계실에서 지침을 종이에 적어 와 다시 옮겨 적어야 했습니다.
; 옮겨 적는 단계마다 오기가 끼고, 그 값이 되돌릴 수 없는 기준선의 근거가 됩니다.
; 그래서 계량기 옆 터치스크린에서 바로 넣게 합니다.
;
;;; 수집 키 — 비워 두고 화면에서 페어링하세요.
;   아래 api_key 를 비워 두면 장비 화면 [설정] → [MRV 연결] 에서 [코드 받기] 를
;   누를 수 있습니다. 6자리 코드가 뜨면, Shrimp365 웹에 로그인해
;   탄소 MRV → 설정 → 「현장 장비 연결」 카드에서 그 코드를 입력하면 연결됩니다.
;   연결되면 키와 사이트 번호가 이 파일에 자동으로 저장됩니다.
;
;   키는 발급 직후 한 번만 내려옵니다. 장비가 키를 잃으면 처음부터 다시
;   페어링해야 합니다(같은 키를 두 번 내주면 지금 누가 들고 있는지 알 수 없으므로).
;
;   수질 쪽 device_key 와는 **다른 키**입니다. 하나로 합치면 수질 장치 키가
;   탄소 증빙 창구를 열 수 있게 되므로 일부러 나눠 두었습니다.
api_key =

; 연결된 사이트 번호. 페어링할 때 자동으로 채워집니다 — 손으로 적지 마세요.
site_id =

; 전송하지 못한 전력 입력을 보관해 둘 파일. **수질 버퍼와 별도 파일**입니다.
; 회선이 끊긴 사이 작업자가 넣은 지침이 유실되면 안 되고, 수질 재전송과
; 뒤섞이면 어느 쪽이 밀렸는지 화면에서 구분할 수 없습니다.
buffer_path = /var/lib/shrimp365/mrv-power.db

; 계측기별 "마지막으로 보낸 지침"을 적어 두는 파일.
; 적산 지침은 **직전 지침과의 차이**로만 구간 사용량이 되므로(ADR 0001), 새 지침을
; 보낼 때 직전 지침을 함께 보내야 합니다. 그 직전 값을 여기에 남깁니다.
; 설정이 아니라 상태이므로 config 가 아닌 별 파일에 둡니다.
last_reading_path = /var/lib/shrimp365/mrv-last-reading.json

[update]
; 원격 소프트웨어 업데이트. 하루 한 번 확인합니다.
;
; 승인제입니다 — 계정 주인이 웹의 기기 카드에서 [업데이트] 를 누른 기기만
; 받아 갑니다. 누르지 않으면 이 기능이 켜져 있어도 아무 일도 일어나지 않습니다.
;
; 받은 꾸러미는 서명을 확인한 뒤에만 적용하고, 적용 후 자리를 잡지 못하면
; 이전 버전으로 자동으로 되돌립니다.
enabled = true

; 기본값은 endpoint 와 같은 사이트의 /updates/manifest.json 입니다.
; 바꿀 일은 거의 없습니다.
; manifest_url = https://www.shrimp365.kr/updates/manifest.json

[history]
; 장비 화면의 그래프(6시간·12시간·24시간·일주일)용 측정 이력.
; 재전송 큐와 별개입니다 — 서버로 올린 뒤에도 남아 있어야 그래프를 그립니다.
; 인터넷이 끊겨 있어도 그래프는 그대로 보입니다.
enabled = true
path = /var/lib/shrimp365/history.db

; 며칠치를 남길지. 화면에서 최대 일주일까지 보므로 여유를 둡니다.
; 1분 간격이면 8일치가 약 11,500건이라 용량은 거의 들지 않습니다.
retention_days = 8
