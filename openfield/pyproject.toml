[project]
name = "ofdf"
version = "0.1.0"
description = "노지 대파 재해위험 판단·조치추천 AI (OpenFieldDigitalFarming) — Shrimp365/Farm365 노지 베드용 엣지"
requires-python = ">=3.11"
dependencies = [
    # 핵심 (requirements.txt 와 같은 집합 — 그 파일은 호환용으로 남겨 둔다)
    "numpy>=1.26",
    "pandas>=2.2",
    "scikit-learn>=1.4",
    "lightgbm>=4.3",
    "pyyaml>=6.0",
    # 데이터 수집/파싱 + 서버 업로더(ofdf.upload)
    "requests>=2.31",
    "lxml>=5.0",
]

# 원본(Ulrim/openfielddigitalfarming)에는 패키징 파일이 없었다. 테스트는
# PYTHONPATH=src 로 돌고 systemd 유닛은 PYTHONPATH 없이 `python -m ofdf.cli`
# 를 불러서, 설치하면 ModuleNotFoundError 가 났다. 이 파일이 그 틈을 메운다 —
# `pip install -e .` 한 venv 에서 `python -m ofdf.cli` 와 `ofdf` 둘 다 뜬다.

[project.optional-dependencies]
# 비전 병해 진단 모델 학습·추론 (requirements-vision.txt). 엣지 판단에는
# 필요 없다 — 라즈베리파이에는 깔지 않는다.
vision = [
    "torch>=2.2",
    "torchvision>=0.17",
    "pillow>=10.0",
    "onnx>=1.15",
    "onnxruntime>=1.17",
    # scripts/benchmark_inference.py --export-onnx 가 쓴다
    "onnxmltools>=1.12",
]
# 라즈베리파이 수집 브리지 — Zigbee2MQTT(scripts/zigbee_bridge.py),
# RS-485 MODBUS(scripts/modbus_bridge.py)
edge = [
    "paho-mqtt>=1.6",
    "pyserial>=3.5",
]
dev = [
    "pytest>=8.2",
    "ruff>=0.4",
]

[project.scripts]
ofdf = "ofdf.cli:main"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# 설치하지 않은 작업본에서도 `pytest` 한 마디로 돌게 한다
pythonpath = ["src"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ofdf"]
