<!doctype html>
<!--
  AMP 양식장 수질 모니터 — 장비 화면 프로토타입 시안
  단일 파일 · 외부 리소스 0(CDN·웹폰트·이미지 링크 없음) · 바닐라 JS

  ★ 임시 브랜드 — 에이엠피 실제 로고·색 받으면 :root 토큰만 교체.
     · 색   : <style> 맨 앞 "BRAND TOKENS" 블록(:root …)만 바꾼다. 화면 CSS 는 토큰만 참조한다.
              상태색(--ok/--warn/--crit)은 브랜드와 무관 — 바꾸지 않는다.
     · 로고 : <svg> 스프라이트 안 <symbol id="amp-mark"> 하나만 바꾼다(모든 자리가 <use> 로 참조).
     · 제품명: <script> 맨 앞 PRODUCT_NAMES 의 [0] 이 기본(1안).
  설계서  : docs/amp/design.md
  판정 기준: raspberry-pi/limits.py BANDS 와 같은 숫자
            (수온 25–32 / 22–35 ℃, pH 7.5–8.5 / 7.0–9.0, DO ≥5.0 / ≥4.0 mg/L, 염도 15–35 / 10–40 ‰)
  다국어  : 기기 화면 문구는 I18N(key → {ko,en,vi,id}) — webui.py 의 I18N 과 같은 모양이라 그대로 옮길 수 있다.
-->
<html lang="ko" data-scheme="a" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>AMP 수질 모니터 — 장비 화면 시안</title>
<style>
/* ======================================================================
   BRAND TOKENS — 임시. 에이엠피 확정 색이 오면 이 블록만 바꾼다.
   구조: :root = ①안 다크(기본) / [data-theme=light] = ①안 라이트 /
         [data-scheme=b|c] = ②·③안. 상태색은 다크·라이트 두 벌만 있고 세 안 공통.
   ====================================================================== */
:root{
  --font: system-ui, "Noto Sans CJK KR", "Noto Sans KR", sans-serif;
  --press: brightness(1.15);

  /* ① 딥네이비 + 시안 · 다크 */
  --logo-tile:#1E4FA8; --logo-line:#FFFFFF; --logo-dot:#22C3E6;
  --brand:#22C3E6; --on-brand:#03222B; --brand-text:#22C3E6; --brand-soft:#22C3E61F; --focus:#7FE3F7;
  --bg:#0A1324; --surface:#111D33; --surface-2:#18263F; --line:#26375A; --line-strong:#3A4E77;
  --text:#EAF0FA; --text-2:#A9B6CC; --text-3:#7D8BA3;

  /* 상태색 — 세 안 공통 · 다크 */
  --ok:#3DD68C; --warn:#FFB020; --crit:#FF6B6B;
  --ok-soft:#3DD68C1A; --warn-soft:#FFB0201F; --crit-soft:#FF6B6B24;
  --crit-fill:#B3261E; --on-crit:#FFFFFF; --band:#3DD68C1F; --scrim:#000000A6;
}
:root[data-theme="light"]{
  --press: brightness(.93);
  /* ① 라이트 */
  --logo-tile:#0F3B78; --logo-line:#FFFFFF; --logo-dot:#22C3E6;
  --brand:#0F3B78; --on-brand:#FFFFFF; --brand-text:#0A5F86; --brand-soft:#0F3B7814; --focus:#0A5F86;
  --bg:#F2F5FA; --surface:#FFFFFF; --surface-2:#E8EDF5; --line:#C9D3E3; --line-strong:#9AA8BF;
  --text:#0B1A33; --text-2:#42526B; --text-3:#5F6E86;
  /* 상태색 — 세 안 공통 · 라이트 */
  --ok:#0E7A45; --warn:#9A5B00; --crit:#C42B2B;
  --ok-soft:#0E7A4514; --warn-soft:#F5A5241F; --crit-soft:#C42B2B14;
  --crit-fill:#B3261E; --on-crit:#FFFFFF; --band:#0E7A4517; --scrim:#0B1A3380;
}
/* ② 딥 틸 + 샌드 */
:root[data-scheme="b"]{
  --logo-tile:#0B6E66; --logo-line:#FFFFFF; --logo-dot:#E6D3A8;
  --brand:#2CC5B0; --on-brand:#04211D; --brand-text:#2CC5B0; --brand-soft:#2CC5B01F; --focus:#8FE8DA;
  --bg:#0B1716; --surface:#12211F; --surface-2:#192D2A; --line:#2A433F; --line-strong:#3E5D58;
  --text:#EEF4F1; --text-2:#AFC2BC; --text-3:#84998F;
}
:root[data-scheme="b"][data-theme="light"]{
  --logo-tile:#0B6E66; --logo-line:#FFFFFF; --logo-dot:#C9A869;
  --brand:#0B6E66; --on-brand:#FFFFFF; --brand-text:#0B6E66; --brand-soft:#0B6E6614; --focus:#0B6E66;
  --bg:#F5F1E8; --surface:#FFFDF8; --surface-2:#ECE5D6; --line:#D3C8B2; --line-strong:#A89C84;
  --text:#10241F; --text-2:#45574F; --text-3:#5E6E66;
}
/* ③ 그래파이트 + 라임 */
:root[data-scheme="c"]{
  --logo-tile:#2A2E31; --logo-line:#B8E62E; --logo-dot:#FFFFFF;
  --brand:#B8E62E; --on-brand:#1A2600; --brand-text:#B8E62E; --brand-soft:#B8E62E1A; --focus:#D6F57A;
  --bg:#111213; --surface:#1A1C1E; --surface-2:#232629; --line:#34383C; --line-strong:#4A5056;
  --text:#F0F2F0; --text-2:#B4BAB6; --text-3:#8A918C;
}
:root[data-scheme="c"][data-theme="light"]{
  --logo-tile:#26292B; --logo-line:#B8E62E; --logo-dot:#FFFFFF;
  --brand:#3D5A0A; --on-brand:#FFFFFF; --brand-text:#3D5A0A; --brand-soft:#3D5A0A14; --focus:#3D5A0A;
  --bg:#F3F4F2; --surface:#FFFFFF; --surface-2:#E7E9E6; --line:#CDD1CC; --line-strong:#9AA19C;
  --text:#16191A; --text-2:#474D4A; --text-3:#646B67;
}
/* ====================== BRAND TOKENS 끝 ====================== */

/* ---------- 바깥 제안 페이지(기기 화면과 별개의 고정 팔레트) ---------- */
:root{
  --p-bg:#E8EBF0; --p-stage:#D9DEE6; --p-surface:#FFFFFF; --p-line:#C9D0DB;
  --p-text:#121821; --p-text-2:#4A5566; --p-ink:#1A2230; --p-focus:#2F6FEB;
}
*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0}
body{background:var(--p-bg);color:var(--p-text);font:400 15px/1.5 var(--font)}
.p-wrap{max-width:1380px;margin:0 auto;padding:20px 20px 56px}
.p-head{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px 24px;margin-bottom:16px}
.p-head h1{font-size:22px;line-height:1.3;margin:0 0 4px;letter-spacing:-.01em}
.p-head p{margin:0;color:var(--p-text-2);max-width:720px}
.p-demo{display:flex;flex-direction:column;align-items:flex-end;gap:6px}
.cap{margin:0;min-height:1.5em;font-size:13px;color:var(--p-text-2);text-align:right}
.p-main{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:20px;align-items:start}
.stage{background:var(--p-stage);border-radius:16px;padding:20px;min-width:0}
.fit{position:relative;width:100%}
.stage-note{margin:12px 0 0;font-size:13px;color:var(--p-text-2);text-align:center}
.panel{display:flex;flex-direction:column;gap:12px}
.grp{background:var(--p-surface);border:1px solid var(--p-line);border-radius:14px;padding:14px}
.grp h2{font-size:13px;letter-spacing:.02em;color:var(--p-text-2);margin:0 0 10px;font-weight:700}
.grp h3{font-size:12px;color:var(--p-text-2);margin:12px 0 6px;font-weight:600}
.opts{display:flex;flex-wrap:wrap;gap:6px}
.opts.col{flex-direction:column}
.opt{min-height:40px;padding:0 12px;border-radius:10px;border:1px solid var(--p-line);background:var(--p-surface);
  color:var(--p-text);font:600 14px/1.2 var(--font);cursor:pointer;display:inline-flex;align-items:center;gap:8px;text-align:left}
.opt:hover{border-color:var(--p-ink)}
.opt[aria-pressed="true"],.opt[aria-current="true"]{background:var(--p-ink);border-color:var(--p-ink);color:#FFFFFF}
.opt:focus-visible{outline:3px solid var(--p-focus);outline-offset:2px}
.opt.primary{background:var(--p-ink);border-color:var(--p-ink);color:#FFFFFF;min-height:44px;padding:0 16px}
.opt .pic{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.opt.primary .pic{fill:currentColor;stroke:none}
.sw{display:inline-flex;border-radius:5px;overflow:hidden;box-shadow:0 0 0 1px #0000001F;flex:none}
.sw i{display:block;width:14px;height:20px}
.hint{margin:10px 0 0;font-size:12.5px;color:var(--p-text-2)}
.p-foot{margin-top:16px;font-size:13px;color:var(--p-text-2)}
.tmp-badge{position:fixed;left:12px;bottom:12px;z-index:50;pointer-events:none;padding:4px 10px;border-radius:8px;
  border:1px dashed #8A6D00;background:#FFF7D6;color:#5C4700;font-size:12px;font-weight:700}
@media (max-width:1040px){ .p-main{grid-template-columns:1fr} }
@media (max-width:560px){ .p-wrap{padding:12px 12px 56px} .stage{padding:10px} .p-head h1{font-size:19px} .p-demo{align-items:stretch;width:100%} .cap{text-align:left} }
@media (pointer:coarse){ .opt{min-height:44px} }

/* ---------- 7인치 베젤(하드웨어 색 — 토큰 아님). 공식 7" 터치: 외형 약 194×110 mm, 표시부 약 155×86 mm 비율 근사 ---------- */
.device{position:absolute;left:0;top:0;width:980px;height:600px;padding:60px 90px;border-radius:26px;
  background:#0E0F11;box-shadow:inset 0 0 0 2px #2A2C30,0 24px 48px -24px #00000080;transform-origin:0 0}

/* ======================================================================
   기기 화면 800×480 — 이 아래는 토큰만 쓴다(직접 hex 금지)
   ====================================================================== */
.screen{position:relative;width:800px;height:480px;overflow:hidden;background:var(--bg);color:var(--text);
  font:500 16px/1.35 var(--font);font-variant-numeric:tabular-nums;-webkit-user-select:none;user-select:none}
:where(.screen button){font:inherit;color:inherit;-webkit-tap-highlight-color:transparent;cursor:pointer;margin:0}
.screen h1,.screen h2,.screen p{margin:0}
.screen button:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
.screen h1[tabindex]:focus{outline:none}
.screen button:active:not(:disabled){filter:var(--press)}
.scr{position:absolute;inset:0;display:flex;flex-direction:column;background:var(--bg)}
.enter{animation:scrIn .18s ease-out}
@keyframes scrIn{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}

.ic{width:24px;height:24px;flex:none;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.ic.s{width:20px;height:20px}
.ic.l{width:28px;height:28px}
.ic.dim{color:var(--text-3)}

/* 워드마크 — 크기는 font-size 하나로 */
.wm{display:inline-flex;align-items:center;gap:.45em;font-size:17px;line-height:1;white-space:nowrap;color:var(--text)}
.wm svg{width:1.65em;height:1.65em;flex:none}
.wm-amp{font-weight:800;letter-spacing:.06em}
.wm-prod{font-weight:600;color:var(--brand-text);margin-left:-.1em}
.wm.md{font-size:24px}
.wm.lg{font-size:40px}

/* 상단 바(모든 화면 공통 높이 56) */
.bar{height:56px;flex:none;display:flex;align-items:center;gap:8px;padding:0 12px;background:var(--surface);border-bottom:1px solid var(--line)}
.bar h1{font-size:20px;font-weight:700;white-space:nowrap}
.sp{flex:1 1 0;min-width:0}
.meta{font-size:14px;color:var(--text-3);white-space:nowrap}
.who{display:flex;flex-direction:column;gap:3px;flex:0 0 auto;min-width:0}
.site{font-size:13px;color:var(--text-2);padding-left:36px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:220px}

/* 버튼 */
.btn{min-height:48px;min-width:48px;display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:0 16px;
  border-radius:12px;border:1px solid var(--line-strong);background:var(--surface);color:var(--text);font-weight:600;font-size:16px;white-space:nowrap}
.btn.ghost{background:transparent}
.btn.back{padding:0 14px 0 8px}
.btn.primary{background:var(--brand);border-color:var(--brand);color:var(--on-brand)}
.btn.danger{background:var(--crit-fill);border-color:var(--crit-fill);color:var(--on-crit)}
.btn.on-crit{background:transparent;border-color:var(--on-crit);color:var(--on-crit)}
.btn:disabled{opacity:.45;cursor:not-allowed}

/* 칩(상단 상태) */
.chip{min-height:48px;display:inline-flex;align-items:center;gap:8px;padding:0 14px;border-radius:24px;flex:0 1 auto;min-width:0;
  border:1px solid var(--line-strong);background:transparent;color:var(--text-2);font-weight:600;font-size:15px;white-space:nowrap}
.chip .lbl{overflow:hidden;text-overflow:ellipsis;min-width:0}
.chip b{font-weight:700}
.chip.ai{border-color:transparent;background:var(--brand-soft);color:var(--brand-text)}
.chip.ai b{color:var(--text)}
.chip.ai.alarm{background:var(--crit-fill);color:var(--on-crit)}
.chip.ai.alarm b{color:var(--on-crit)}
.chip.ai.hold{background:var(--surface-2);color:var(--text-2)}
.chip.net.fail{border-color:var(--warn);background:var(--warn-soft);color:var(--warn)}

/* 상태 표지 — 색 + 아이콘 모양 + 글자 3중 */
.pill{display:inline-flex;align-items:center;gap:6px;height:32px;padding:0 12px 0 8px;border-radius:16px;font-size:15px;font-weight:700;white-space:nowrap;flex:none}
.pill.ok{color:var(--ok)}
.pill.warn{color:var(--warn);background:var(--warn-soft);box-shadow:inset 0 0 0 1px var(--warn)}
.pill.crit{color:var(--on-crit);background:var(--crit-fill)}
.pill.fault{color:var(--text-2);box-shadow:inset 0 0 0 1px var(--line-strong)}

/* 대시보드 — 값 칸 */
.grid{flex:1;min-height:0;display:grid;grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr;gap:10px;padding:10px 12px 0}
.card{display:flex;flex-direction:column;justify-content:space-between;min-width:0;text-align:left;padding:12px 18px 12px;
  border-radius:16px;border:2px solid var(--line);background:var(--surface);color:var(--text)}
.card-top{display:flex;align-items:center;justify-content:space-between;gap:8px}
.card-k{font-size:18px;font-weight:600;color:var(--text-2)}
.card-v{display:flex;align-items:baseline;gap:8px;line-height:1}
.num{font-size:72px;font-weight:700;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.unit{font-size:22px;font-weight:600;color:var(--text-2)}
.card-f{display:flex;align-items:center;gap:14px;font-size:14px;color:var(--text-3);white-space:nowrap;overflow:hidden}
.card-f .tr{display:inline-flex;align-items:center;gap:4px}
.card.warn{border-color:var(--warn);background:linear-gradient(var(--warn-soft),var(--warn-soft)),var(--surface)}
.card.crit{border-color:var(--crit);box-shadow:inset 0 0 0 1px var(--crit);background:linear-gradient(var(--crit-soft),var(--crit-soft)),var(--surface)}
.card.fault{border-style:dashed;border-color:var(--line-strong)}
.card.fault .num{font-size:48px;color:var(--text-3)}
.card-err{display:flex;flex-direction:column;gap:2px;min-width:0}
.card-err b{display:inline-flex;align-items:center;gap:6px;font-size:16px;color:var(--text)}
.card-err small{font-size:13px;color:var(--text-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* 권고 띠 / 경보 띠 */
.strip{flex:none;height:64px;margin:10px 12px 12px;display:flex;align-items:center;gap:12px;padding:0 8px 0 12px;
  border-radius:14px;border:1px solid var(--line);background:var(--surface);color:var(--text);text-align:left}
button.strip{width:calc(100% - 24px)}
.strip .ico{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;flex:none;background:var(--brand-soft);color:var(--brand-text)}
.strip .txt{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.strip .lbl{font-size:13px;font-weight:600;color:var(--text-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.strip .msg{font-size:18px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.strip .more{display:inline-flex;align-items:center;gap:4px;padding:0 8px;color:var(--brand-text);font-weight:600;font-size:15px;white-space:nowrap}
.strip.alarm{background:var(--crit-fill);border-color:var(--crit-fill);color:var(--on-crit)}
.strip.alarm .ico{background:transparent;color:var(--on-crit);box-shadow:inset 0 0 0 2px var(--on-crit)}
.strip.alarm .lbl{color:var(--on-crit)}
.strip.alarm .acked{display:inline-flex;align-items:center;gap:6px;font-size:14px;font-weight:600;padding:0 8px;white-space:nowrap}
.strip.pulse{animation:alarmPulse 1.5s ease-in-out 4}
@keyframes alarmPulse{50%{box-shadow:0 0 0 5px var(--crit-soft);filter:brightness(1.18)}}
.strip.fault .ico,.strip.unl .ico{background:var(--surface-2);color:var(--text-2)}
.strip.fault{border-style:dashed;border-color:var(--line-strong)}

/* 공통 본문 */
.body{flex:1;min-height:0;padding:12px;display:flex;flex-direction:column;gap:10px}

/* 그래프 */
.cnow{display:inline-flex;align-items:baseline;gap:4px;font-size:28px;font-weight:700;margin-left:4px}
.cnow small{font-size:15px;color:var(--text-2);font-weight:600}
.seg{display:inline-flex;gap:6px}
.seg button{min-height:48px;min-width:76px;padding:0 14px;border-radius:12px;border:1px solid var(--line-strong);background:transparent;color:var(--text-2);font-weight:600;font-size:16px}
.seg button[aria-pressed="true"]{background:var(--brand);border-color:var(--brand);color:var(--on-brand)}
.stats{display:flex;align-items:baseline;gap:20px;font-size:14px;color:var(--text-2);white-space:nowrap}
.stats b{font-size:20px;font-weight:700;color:var(--text);margin-left:6px}
.lg{display:inline-flex;align-items:center;gap:6px;font-size:13px;color:var(--text-2)}
.lg-band{width:18px;height:12px;border-radius:3px;background:var(--band);box-shadow:inset 0 0 0 1px var(--ok)}
.lg-warn{width:18px;height:0;border-top:2px dashed var(--warn)}
.plot{flex:1;min-height:0;border-radius:14px;border:1px solid var(--line);background:var(--surface);padding:6px}
.plot svg{display:block;width:100%;height:100%}
.c-band{fill:var(--band)}
.c-grid{stroke:var(--line);stroke-width:1}
.c-lab{fill:var(--text-3);font-size:13px}
.c-warn{stroke:var(--warn);stroke-width:1.5;stroke-dasharray:6 5}
.c-wl{fill:var(--warn);font-size:13px;font-weight:700}
.c-line{fill:none;stroke:var(--brand-text);stroke-width:2.5;stroke-linejoin:round;stroke-linecap:round}
.c-dot{fill:var(--brand-text);stroke:var(--surface);stroke-width:3}

/* AI 판단 */
.ai-wrap{flex:1;min-height:0;display:grid;grid-template-columns:1fr 272px;gap:12px}
.finds{display:flex;flex-direction:column;gap:8px;min-height:0}
.find{display:grid;grid-template-columns:40px 1fr auto;column-gap:12px;row-gap:3px;align-items:center;padding:12px 14px;border-radius:14px;border:1px solid var(--line);background:var(--surface)}
.find .fi{grid-row:span 2;align-self:start;width:40px;height:40px;border-radius:12px;display:grid;place-items:center;background:var(--brand-soft);color:var(--brand-text)}
.find .ft{font-size:17px;font-weight:700;min-width:0}
.find .tm{font-size:13px;color:var(--text-3);white-space:nowrap}
.find .fw{grid-column:2 / 4;font-size:14px;line-height:1.4;color:var(--text-2)}
.find .fw b{color:var(--text);margin-right:6px}
.find.crit{border-color:var(--crit);box-shadow:inset 0 0 0 1px var(--crit)}
.find.crit .fi{background:var(--crit-fill);color:var(--on-crit)}
.find.ok .fi{background:var(--ok-soft);color:var(--ok)}
.find.fault{border-style:dashed;border-color:var(--line-strong)}
.find.fault .fi{background:var(--surface-2);color:var(--text-2)}
.eng{display:flex;flex-direction:column;padding:4px 14px 12px;border-radius:14px;border:1px solid var(--line);background:var(--surface)}
.eng-row{display:grid;grid-template-columns:28px 1fr auto;column-gap:10px;row-gap:2px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.eng-row .n{grid-row:span 2;align-self:start;width:28px;height:28px;border-radius:50%;display:grid;place-items:center;font-size:14px;font-weight:700;background:var(--brand-soft);color:var(--brand-text)}
.eng-row b{font-size:15px}
.eng-row .c{font-size:15px;font-weight:700;color:var(--brand-text);text-align:right;white-space:nowrap}
.eng-row small{grid-column:2 / 4;font-size:12.5px;color:var(--text-2)}
.eng-note{display:flex;gap:8px;align-items:flex-start;margin-top:10px!important;font-size:13px;color:var(--text-2)}

/* 기기 정보 */
.info{flex:1;min-height:0;display:grid;grid-template-columns:300px 1fr;gap:12px}
.info-l{display:flex;flex-direction:column;gap:12px}
.box{border-radius:14px;border:1px solid var(--line);background:var(--surface);padding:4px 16px}
.dl{margin:0}
.dl div{display:flex;justify-content:space-between;align-items:baseline;gap:12px;padding:9px 0;border-bottom:1px solid var(--line);font-size:15px}
.dl div:last-child{border-bottom:0}
.dl dt{color:var(--text-2);white-space:nowrap}
.dl dd{margin:0;font-weight:600;text-align:right;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.powered{flex:none;text-align:center;font-size:12px;color:var(--text-3);padding-bottom:2px}

/* 설정 타일 */
.tiles{flex:1;min-height:0;display:grid;grid-template-columns:1fr 1fr;grid-template-rows:repeat(4,1fr);gap:10px}
.tile{display:grid;grid-template-columns:44px 1fr 20px;align-items:center;gap:12px;padding:0 14px;min-height:72px;text-align:left;
  border-radius:14px;border:1px solid var(--line);background:var(--surface);color:var(--text)}
.tile .ti{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;background:var(--brand-soft);color:var(--brand-text)}
.tile b{display:block;font-size:18px;font-weight:700}
.tile small{display:block;font-size:13px;color:var(--text-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tile.danger .ti{background:var(--crit-soft);color:var(--crit)}

/* 목록 행 */
.list{display:flex;flex-direction:column;gap:8px}
.row{display:flex;align-items:center;gap:12px;min-height:60px;padding:6px 8px 6px 16px;border-radius:14px;border:1px solid var(--line);background:var(--surface);color:var(--text);text-align:left}
.rowbtn{width:100%;min-height:56px;padding-right:16px}
.row.cur{border-color:var(--brand);box-shadow:inset 0 0 0 1px var(--brand)}
.rn{flex:1;min-width:0}
.rn b{display:block;font-size:17px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rn small{display:block;font-size:13px;color:var(--text-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.okt{display:inline-flex;align-items:center;gap:6px;font-size:14px;font-weight:600;color:var(--ok);white-space:nowrap}
.toggle{min-height:48px;min-width:108px;display:inline-flex;align-items:center;gap:10px;padding:0 16px 0 8px;border-radius:24px;
  border:1px solid var(--line-strong);background:var(--surface-2);color:var(--text-2);font-weight:700;font-size:15px}
.toggle .knob{width:32px;height:32px;border-radius:50%;background:var(--text-3);flex:none}
.toggle[aria-pressed="true"]{background:var(--brand);border-color:var(--brand);color:var(--on-brand)}
.toggle[aria-pressed="true"] .knob{background:var(--on-brand)}
.off{min-width:72px;text-align:right;font-size:20px;font-weight:700}
.btn-ph{display:inline-block;width:88px;flex:none}
.calr{min-width:88px}
.note{display:flex;gap:10px;align-items:flex-start;padding:12px 14px;border-radius:12px;background:var(--warn-soft);font-size:14px;color:var(--text)}
.note .ic{color:var(--warn)}
.cur-net{display:flex;align-items:center;gap:10px;min-height:52px;padding:0 16px;border-radius:12px;background:var(--surface-2);font-size:15px}
.cur-net.warn{background:var(--warn-soft);box-shadow:inset 0 0 0 1px var(--warn)}
.cur-net .st{display:inline-flex;align-items:center;gap:6px;font-weight:600}
.bars{display:inline-flex;align-items:flex-end;gap:3px;height:20px;flex:none}
.bars i{display:block;width:5px;border-radius:1.5px;background:var(--line-strong)}
.bars i:nth-child(1){height:6px}.bars i:nth-child(2){height:10px}.bars i:nth-child(3){height:15px}.bars i:nth-child(4){height:20px}
.bars i.on{background:var(--text)}
.empty{flex:1;display:grid;place-items:center;color:var(--text-2);font-size:16px}

/* 센서 테스트 */
.tgrid{flex:1;min-height:0;display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.tcard{display:flex;flex-direction:column;gap:6px;padding:12px 14px;border-radius:14px;border:1px solid var(--line);background:var(--surface);min-width:0}
.tcard.fault{border-style:dashed;border-color:var(--line-strong)}
.th{display:flex;align-items:baseline;justify-content:space-between;gap:8px}
.th h2{font-size:16px;font-weight:700}
.addr{font-size:13px;color:var(--text-3);white-space:nowrap}
.tstat{display:inline-flex;align-items:center;gap:6px;font-size:14px;font-weight:700}
.tstat.good{color:var(--ok)}
.tsub{font-size:13px;color:var(--text-2)}
.tline{display:grid;grid-template-columns:1fr auto;gap:0 8px;padding:7px 0 0;border-top:1px solid var(--line)}
.tline .tn{font-size:14px;color:var(--text-2)}
.tline .tv{font-size:18px;font-weight:700;text-align:right}
.tline .tv small{font-size:13px;color:var(--text-2);font-weight:600;margin-left:3px}
.tline .tr{grid-column:1 / 3;font-size:12px;color:var(--text-3)}
.prog{width:240px;height:4px;border-radius:2px;background:var(--surface-2);overflow:hidden}
.prog.sm{width:100%}
.prog i{display:block;width:100%;height:100%;background:var(--brand);transform-origin:left;animation:prog 1.5s linear forwards}
@keyframes prog{from{transform:scaleX(0)}to{transform:scaleX(1)}}

/* 언어 */
.langs{flex:1;min-height:0;display:grid;grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr;gap:10px}
.lang{position:relative;display:flex;flex-direction:column;justify-content:center;gap:4px;padding:0 22px;text-align:left;border-radius:16px;border:1px solid var(--line);background:var(--surface);color:var(--text)}
.lang b{font-size:24px;font-weight:700}
.lang small{font-size:14px;color:var(--text-2)}
.lang[aria-pressed="true"]{border:2px solid var(--brand);background:linear-gradient(var(--brand-soft),var(--brand-soft)),var(--surface)}
.lang .ic{position:absolute;right:18px;top:50%;margin-top:-12px;color:var(--brand-text)}

/* 전력 회로 */
.ptable{width:100%;border-collapse:separate;border-spacing:0;border:1px solid var(--line);border-radius:14px;background:var(--surface);overflow:hidden}
.ptable th,.ptable td{padding:9px 14px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}
.ptable tr:last-child td{border-bottom:0}
.ptable th:first-child,.ptable td:first-child{text-align:left}
.ptable th{font-size:13px;font-weight:600;color:var(--text-2)}
.ptable td{font-size:17px;font-weight:700}
.ptable td small{display:block;font-size:12px;font-weight:500;color:var(--text-3)}
.ptable tr.tot td{background:var(--surface-2)}
.onoff{display:inline-flex;align-items:center;height:28px;padding:0 10px;border-radius:14px;font-size:13px;font-weight:700;box-shadow:inset 0 0 0 1px var(--line-strong);color:var(--text-2)}
.onoff.on{background:var(--brand-soft);box-shadow:none;color:var(--brand-text)}

/* 기기 연결 */
.pair{flex:1;min-height:0;display:grid;grid-template-columns:1fr 1fr;gap:20px;align-items:center;padding:0 8px}
.steps{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:12px}
.steps li{display:grid;grid-template-columns:36px 1fr;gap:12px;align-items:center;font-size:17px}
.steps .n{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;font-weight:700;background:var(--brand-soft);color:var(--brand-text)}
.pnote{display:flex;gap:8px;align-items:flex-start;margin-top:16px!important;font-size:13px;color:var(--text-2)}
.pcode{display:flex;flex-direction:column;align-items:center;gap:14px}
.code{display:flex;gap:8px}
.code span{width:52px;height:76px;border-radius:12px;display:grid;place-items:center;font-size:44px;font-weight:700;
  border:2px solid var(--line-strong);background:var(--surface);color:var(--brand-text)}
.code .gap{width:6px;border:0;background:none}
.exp{font-size:15px;color:var(--text-2)}
.wait{display:inline-flex;align-items:center;gap:6px;font-size:15px;color:var(--text-2)}
.wait i{width:8px;height:8px;border-radius:50%;background:var(--brand-text);animation:blink 1.2s infinite}
.wait i:nth-child(2){animation-delay:.2s}.wait i:nth-child(3){animation-delay:.4s;margin-right:6px}
@keyframes blink{0%,100%{opacity:.25}50%{opacity:1}}

/* 부팅 */
.boot{align-items:center;justify-content:center;gap:24px}
.boot small{font-size:13px;color:var(--text-3)}

/* 모달 */
.modal{position:absolute;inset:0;z-index:10;display:grid;place-items:center;background:var(--scrim)}
.dialog{width:460px;display:flex;flex-direction:column;gap:12px;padding:20px;border-radius:18px;border:1px solid var(--line-strong);background:var(--surface)}
.dialog h2{font-size:20px;font-weight:700}
.dsub{font-size:14px;color:var(--text-2)}
.dlg-btns{display:flex;justify-content:flex-end;gap:10px}
.kp-disp{height:56px;display:flex;align-items:baseline;justify-content:flex-end;gap:6px;padding:10px 16px 0;border-radius:12px;background:var(--surface-2);font-size:32px;font-weight:700}
.kp-disp .ph{color:var(--text-3)}
.kp-disp small{font-size:15px;color:var(--text-2)}
.kp{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.kp .btn{min-height:52px;font-size:22px}

/* 토스트 */
.toast{position:absolute;left:50%;bottom:16px;z-index:20;transform:translateX(-50%);max-width:640px;padding:12px 18px;border-radius:12px;background:var(--text);color:var(--bg);font-size:15px;font-weight:600;white-space:nowrap}

@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{animation-duration:.001ms!important;animation-iteration-count:1!important;transition-duration:.001ms!important}
  .wait i{opacity:1}
}
@media (max-width:720px){
  /* 휴대폰: 아래 고정이면 패널 버튼 위에 떠서 가린다 — 맨 위 오른쪽 구석으로 */
  .tmp-badge{top:8px;right:8px;left:auto;bottom:auto;opacity:.92}
}
</style>
</head>
<body>

<!-- 아이콘 스프라이트 — 24px 격자, 선 2px, 끝 둥글게(한 계열). 로고 심볼은 맨 위 하나. -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false">

  <symbol id="amp-mark" viewBox="0 0 32 32">
    <rect width="32" height="32" rx="8" style="fill:var(--logo-tile)"/>

    <path d="M10.8 18.6q2.6-2.2 5.2 0t5.2 0" style="fill:none;stroke:var(--logo-line);stroke-width:2.4;stroke-linecap:round"/>

  <symbol id="i-crit" viewBox="0 0 24 24"><path d="M8.2 2.8h7.6l5.4 5.4v7.6l-5.4 5.4H8.2l-5.4-5.4V8.2Z"/><path d="M12 7.6v5.2M12 16.4v.01"/></symbol>
  <symbol id="i-unplug" viewBox="0 0 24 24"><path d="M9 3v4M15 3v4M6.5 7h11v4a5.5 5.5 0 0 1-11 0ZM12 16.5V21"/><path d="M3 3l18 18"/></symbol>
  <symbol id="i-ai" viewBox="0 0 24 24"><path d="M11 3.5l1.7 4.8 4.8 1.7-4.8 1.7L11 16.5l-1.7-4.8L4.5 10l4.8-1.7Z"/><path d="M18 14.5l.8 2 2 .8-2 .8-.8 2-.8-2-2-.8 2-.8Z"/></symbol>
  <symbol id="i-cloud" viewBox="0 0 24 24"><path d="M7 19h10.5a4.5 4.5 0 0 0 .4-8.98A6.5 6.5 0 0 0 5.4 11.6 3.8 3.8 0 0 0 7 19Z"/></symbol>
  <symbol id="i-cloudoff" viewBox="0 0 24 24"><path d="M7 19h10.5a4.5 4.5 0 0 0 .4-8.98A6.5 6.5 0 0 0 5.4 11.6 3.8 3.8 0 0 0 7 19Z"/><path d="M3 3l18 18"/></symbol>
  <symbol id="i-link" viewBox="0 0 24 24"><path d="M10 14a4.5 4.5 0 0 0 6.4 0l3.2-3.2a4.5 4.5 0 0 0-6.4-6.4L12 5.6"/><path d="M14 10a4.5 4.5 0 0 0-6.4 0l-3.2 3.2a4.5 4.5 0 0 0 6.4 6.4l1.2-1.2"/></symbol>
  <symbol id="i-linkoff" viewBox="0 0 24 24"><path d="M10 14a4.5 4.5 0 0 0 6.4 0l3.2-3.2a4.5 4.5 0 0 0-6.4-6.4L12 5.6"/><path d="M14 10a4.5 4.5 0 0 0-6.4 0l-3.2 3.2a4.5 4.5 0 0 0 6.4 6.4l1.2-1.2"/><path d="M3 3l18 18"/></symbol>
  <symbol id="i-info" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 11v5.5M12 7.8v.01"/></symbol>
  <symbol id="i-sliders" viewBox="0 0 24 24"><path d="M4 6h3M11 6h9M4 12h9M17 12h3M4 18h1M9 18h11"/><circle cx="9" cy="6" r="2"/><circle cx="15" cy="12" r="2"/><circle cx="7" cy="18" r="2"/></symbol>

  <symbol id="i-del" viewBox="0 0 24 24"><path d="M9 5h11a1 1 0 0 1 1 1v12a1 1 0 0 1-1 1H9l-6-7Z"/><path d="M12 9.5l5 5M17 9.5l-5 5"/></symbol>

<div class="p-wrap">
  <header class="p-head">
    <div>
      <h1 data-ui="title">AMP 양식장 수질 모니터 — 장비 화면 시안</h1>
      <p data-ui="intro"></p>

        <div class="device" id="device">
          <div class="screen" id="screen">
            <div id="view"></div>
            <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>

    <aside class="panel">

      <section class="grp">

        <nav class="opts" id="navOpts">

          <button class="opt" type="button" data-p="nav:main" data-ui="nv_main"></button>

          <button class="opt" type="button" data-p="nav:sensors" data-ui="nv_sensors"></button>
          <button class="opt" type="button" data-p="nav:test" data-ui="nv_test"></button>
          <button class="opt" type="button" data-p="nav:cal" data-ui="nv_cal"></button>
          <button class="opt" type="button" data-p="nav:wifi" data-ui="nv_wifi"></button>
          <button class="opt" type="button" data-p="nav:lang" data-ui="nv_lang"></button>
          <button class="opt" type="button" data-p="nav:power" data-ui="nv_power"></button>
          <button class="opt" type="button" data-p="nav:restart" data-ui="nv_restart"></button>
          <button class="opt" type="button" data-p="nav:pair" data-ui="nv_pair"></button>
        </nav>
      </section>

      <section class="grp">
        <h2 data-ui="g_color"></h2>
        <div class="opts col">

/* 시연 시계 — 새벽 02:40 에서 시작해 실제 시간만큼 흐른다(야간 DO 하락 상황) */
var T0 = Date.now(), BASE = new Date(2026, 9, 30, 2, 40, 0).getTime();
function now(){ return new Date(BASE + (Date.now() - T0)); }
function minusMin(d, m){ return new Date(d.getTime() - m * 60000); }
function pad2(n){ return (n < 10 ? '0' : '') + n; }
function hhmm(d){ return pad2(d.getHours()) + ':' + pad2(d.getMinutes()); }
function mmss(s){ return Math.floor(s / 60) + ':' + pad2(s % 60); }
function dlabel(d){ var m = d.getMonth() + 1, day = d.getDate(); return (S.lang === 'ko' || S.lang === 'en') ? m + '/' + day : day + '/' + m; }
function lastSync(){ var d = now(); d.setSeconds(d.getSeconds() - d.getSeconds() % 30); return d; }

/* ---------- 도우미 ---------- */
var LOC = {ko:'ko-KR', en:'en-US', vi:'vi-VN', id:'id-ID'};
function t(k, vars){
  var e = I18N[k], s = e ? (e[S.lang] || e.en || e.ko) : k;
  if(vars){ for(var x in vars){ s = s.split('{' + x + '}').join(String(vars[x])); } }
  return s;
}
function ui(k){ var e = UI[k]; return e ? (e[S.lang] || e.en || e.ko) : k; }
function fmt(v, d){ return new Intl.NumberFormat(LOC[S.lang], {minimumFractionDigits:d, maximumFractionDigits:d}).format(v); }
function fmtSigned(v, d){
  var r = Number(v.toFixed(d));
  return (r > 0 ? '+' : r < 0 ? '−' : '±') + fmt(Math.abs(r), d);
}
function decSep(){ return fmt(1.5, 1).charAt(1); }
function esc(s){ return String(s).replace(/[&<>"']/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
function ic(id, cls){ return '<svg class="ic' + (cls ? ' ' + cls : '') + '" aria-hidden="true" focusable="false"><use href="#i-' + id + '"/></svg>'; }
function wm(cls){

  return '<span class="wm' + (cls ? ' ' + cls : '') + '" role="img" aria-label="AMP ' + n + '">' +

/* 센서 꺼짐 / 시나리오 고장 → 값 대신 오류 */
function faultOf(k){
  var sk = k === 'ph' ? 'ph' : k === 'oxy' ? 'oxy' : (k === 'sal' || k === 'ec') ? 'ec' : null;
  if(sk && !S.on[sk]) return 'off';
  if(S.scenario === 'sensor'){ if(k === 'oxy') return 'electrode'; if(k === 'sal' || k === 'ec') return 'noresp'; }
  return null;
}
function val(k){ if(faultOf(k)) return null; return k === 'ec' ? S.v.sal * EC_PER_SAL : S.v[k]; }
function trend(k){
  if(val(k) == null) return null;
  if(k === 'oxy' && S.scenario === 'alarm') return -1.5;
  return {temp:0.1, ph:-0.03, oxy:-0.2, sal:0, ec:0}[k];
}
function rangeTxt(k){
  var b = BANDS[k].ok, d = METRICS[k].rd;
  return b[1] == null ? t('atleast', {v:fmt(b[0], d)}) : fmt(b[0], d) + '–' + fmt(b[1], d);
}

    body = '<span class="card-v"><span class="num">— —</span><span class="unit">' + m.unit + '</span></span>';
    foot = '<span class="card-err"><b>' + ic('unplug', 's') + t('e_' + f) + '</b><small>' + t('e_' + f + '_sub') + '</small></span>';
  } else {
    var tr = trend(k);
    body = '<span class="card-v"><span class="num">' + fmt(v, m.d) + '</span><span class="unit">' + m.unit + '</span></span>';
    foot = '<span class="card-f"><span>' + t('target') + ' ' + rangeTxt(k) + '</span>' +
      (tr == null ? '' : '<span class="tr">' + ic(tr < -0.001 ? 'down' : tr > 0.001 ? 'up' : 'flat', 's') + t('per1h') + ' ' + fmtSigned(tr, m.d) + '</span>') + '</span>';

/* ---------- 그래프 ---------- */
function rng(seed){
  return function(){
    seed |= 0; seed = seed + 0x6D2B79F5 | 0;
    var x = Math.imul(seed ^ seed >>> 15, 1 | seed);
    x = x + Math.imul(x ^ x >>> 7, 61 | x) ^ x;
    return ((x ^ x >>> 14) >>> 0) / 4294967296;
  };
}
function series(k, range){
  var m = METRICS[k], is7 = range === '7d', N = is7 ? 169 : 145, stepH = is7 ? 1 : 1 / 6;
  var r = rng((k.charCodeAt(0) * 7919 + k.length * 131 + (is7 ? 13 : 3)) * 104729);
  var end = now(), endH = end.getHours() + end.getMinutes() / 60, out = [], n = 0, i, j;
  for(i = 0; i < N; i++){
    var hAgo = (N - 1 - i) * stepH, h = endH - hAgo, day = Math.floor(h / 24);
    n = n * 0.85 + (r() - 0.5) * m.noise * 4;
    var amp = m.amp * (1 + 0.18 * Math.sin(day * 1.7));
    out.push({v: m.mean + amp * Math.sin(2 * Math.PI * (h - m.phase) / 24) + n});
  }
  var cur = k === 'ec' ? S.v.sal * EC_PER_SAL : S.v[k];
  if(S.scenario === 'alarm' && k === 'oxy'){
    var steps = is7 ? 2 : 5, from = out[N - 1 - steps].v;
    for(j = 1; j <= steps; j++){ out[N - 1 - steps + j].v = from + (cur - from) * (j / steps); }
  } else {
    var A = 12, d = cur - out[N - 1].v;
    for(j = 0; j < A; j++){ out[N - A + j].v += d * ((j + 1) / A); }
  }
  if(faultOf(k)){ out[N - 1].v = null; out[N - 2].v = null; if(!is7) out[N - 3].v = null; }
  return out;
}
function stats(data){
  var vs = data.filter(function(p){ return p.v != null; }).map(function(p){ return p.v; });
  var sum = vs.reduce(function(a, b){ return a + b; }, 0);
  return {min:Math.min.apply(null, vs), max:Math.max.apply(null, vs), avg:sum / vs.length};
}
function nice(x){ var e = Math.pow(10, Math.floor(Math.log(x) / Math.LN10)), f = x / e; return (f < 1.5 ? 1 : f < 3 ? 2 : f < 7 ? 5 : 10) * e; }
function decOf(step){ return Math.max(0, -Math.floor(Math.log(step) / Math.LN10 + 1e-9)); }

function chartSvg(k, data, st){
  var W = 762, H = 330, L = 52, R = 14, T = 12, B = 30, m = METRICS[k], b = BANDS[k];
  var lo = st.min, hi = st.max, span = Math.max(hi - lo, m.minSpan);
  if(hi - lo < m.minSpan){ var c = (hi + lo) / 2; lo = c - span / 2; hi = c + span / 2; }
  [b.ok[0], b.ok[1], b.warn[0], b.warn[1]].forEach(function(x){
    if(x != null && x >= lo - 1.5 * span && x <= hi + 1.5 * span){ lo = Math.min(lo, x); hi = Math.max(hi, x); }
  });
  var padv = (hi - lo) * 0.08; lo -= padv; hi += padv;
  var pw = W - L - R, ph = H - T - B;
  function X(i){ return L + i * pw / (data.length - 1); }
  function Y(v){ return T + (hi - v) * ph / (hi - lo); }
  var s = '';
  var bl = b.ok[0] == null ? lo : Math.max(lo, b.ok[0]), bh = b.ok[1] == null ? hi : Math.min(hi, b.ok[1]);
  if(bh > bl) s += '<rect class="c-band" x="' + L + '" y="' + Y(bh).toFixed(1) + '" width="' + pw + '" height="' + (Y(bl) - Y(bh)).toFixed(1) + '"/>';
  var step = nice((hi - lo) / 4), dd = decOf(step), g = 0;
  for(var yv = Math.ceil(lo / step) * step; yv <= hi + 1e-9 && g < 12; yv += step, g++){
    var yy = Y(yv).toFixed(1);
    s += '<line class="c-grid" x1="' + L + '" x2="' + (W - R) + '" y1="' + yy + '" y2="' + yy + '"/>' +
         '<text class="c-lab" x="' + (L - 8) + '" y="' + (Y(yv) + 4).toFixed(1) + '" text-anchor="end">' + fmt(yv, dd) + '</text>';
  }
  [b.warn[0], b.warn[1]].forEach(function(x){
    if(x != null && x > lo && x < hi){
      var wy = Y(x).toFixed(1);
      s += '<line class="c-warn" x1="' + L + '" x2="' + (W - R) + '" y1="' + wy + '" y2="' + wy + '"/>' +
           '<text class="c-wl" x="' + (W - R - 4) + '" y="' + (Y(x) - 6).toFixed(1) + '" text-anchor="end">' + fmt(x, 1) + '</text>';
    }
  });
  var d = '', pen = false, last = -1;
  data.forEach(function(p, i){
    if(p.v == null){ pen = false; return; }
    d += (pen ? 'L' : 'M') + X(i).toFixed(1) + ' ' + Y(p.v).toFixed(1); pen = true; last = i;
  });
  s += '<path class="c-line" d="' + d + '"/>';
  if(last >= 0) s += '<circle class="c-dot" cx="' + X(last).toFixed(1) + '" cy="' + Y(data[last].v).toFixed(1) + '" r="5"/>';
  var e = now(), labs = S.range === '24h'
    ? [hhmm(minusMin(e, 1440)), hhmm(minusMin(e, 720)), hhmm(e)]
    : [dlabel(minusMin(e, 10080)), dlabel(minusMin(e, 5040)), dlabel(e)];
  s += '<text class="c-lab" x="' + L + '" y="' + (H - 8) + '" text-anchor="start">' + labs[0] + '</text>' +
       '<text class="c-lab" x="' + (L + pw / 2) + '" y="' + (H - 8) + '" text-anchor="middle">' + labs[1] + '</text>' +
       '<text class="c-lab" x="' + (W - R) + '" y="' + (H - 8) + '" text-anchor="end">' + labs[2] + '</text>';
  var aria = t('chart_aria', {m:t(m.label), r:t(S.range === '24h' ? 'r24' : 'r7d'), min:fmt(st.min, m.d), avg:fmt(st.avg, m.d), max:fmt(st.max, m.d), band:rangeTxt(k)});
  return '<svg viewBox="0 0 ' + W + ' ' + H + '" preserveAspectRatio="xMidYMid meet" role="img" aria-label="' + esc(aria) + '">' + s + '</svg>';
}

function vChart(){
  var k = S.chartKey, m = METRICS[k], v = val(k), f = faultOf(k), lv = f ? 'fault' : level(k, v);
  var data = series(k, S.range), st = stats(data);

  return '<div class="scr">' +

      '<h1 tabindex="-1">' + t(m.label) + '</h1>' +
      '<span class="cnow">' + (f ? '— —' : fmt(v, m.d)) + '<small>' + m.unit + '</small></span>' + pill(lv) +
      '<span class="sp"></span>' +
      '<span class="seg" role="group" aria-label="' + t('period') + '">' + seg('24h', 'r24') + seg('7d', 'r7d') + '</span>' +
    '</header>' +
    '<div class="body">' +
      '<div class="stats"><span>' + t('st_min') + '<b>' + fmt(st.min, m.d) + '</b></span><span>' + t('st_avg') + '<b>' + fmt(st.avg, m.d) + '</b></span><span>' + t('st_max') + '<b>' + fmt(st.max, m.d) + '</b></span>' +
        '<span class="sp"></span><span class="lg"><i class="lg-band"></i>' + t('band') + ' ' + rangeTxt(k) + '</span><span class="lg"><i class="lg-warn"></i>' + t('warnline') + '</span></div>' +
      '<div class="plot">' + chartSvg(k, data, st) + '</div>' +
    '</div></div>';
}

var TESTS = [
  {name:'sn_ph', addr:1, sensor:'ph', rows:[['pH', 'ph', 2, '', 788], ['ORP', 186, 0, 'mV', 186], ['m_temp', 28.5, 1, '°C', 285]]},
  {name:'m_do', addr:3, sensor:'oxy', rows:[['m_do', 'oxy', 1, 'mg/L', 560], ['f_sat', 72, 0, '%', 720], ['m_temp', 28.4, 1, '°C', 284]]},
  {name:'sn_ec', addr:4, sensor:'ec', rows:[['m_ec', 'ec', 1, 'mS/cm', 2912], ['m_sal', 'sal', 1, '‰', 182], ['m_temp', 28.6, 1, '°C', 286]]}
];
function vTest(){
  var cards = TESTS.map(function(g){
    var f = S.testing ? 'run' : (!S.on[g.sensor] ? 'off' : (S.scenario === 'sensor' && g.sensor === 'oxy') ? 'electrode' : (S.scenario === 'sensor' && g.sensor === 'ec') ? 'noresp' : null);
    var head = '<div class="th"><h2>' + t(g.name) + '</h2><span class="addr">' + t('addr', {n:g.addr}) + '</span></div>', body = '';
    if(f === 'run'){
      body = '<p class="tstat">' + t('testing') + '</p><div class="prog sm"><i></i></div>';
    } else if(f === 'off'){
      body = '<p class="tstat">' + ic('power', 's') + t('off') + '</p><p class="tsub">' + t('e_off_sub') + '</p>';
    } else if(f === 'noresp'){
      body = '<p class="tstat">' + ic('unplug', 's') + t('comm_fail') + '</p><p class="tsub">' + t('comm_fail_s') + '</p>';
    } else {
      body = '<p class="tstat good">' + ic('check', 's') + t('comm_ok') + '</p>' + g.rows.map(function(r){
        var v = typeof r[1] === 'string' ? (f === 'electrode' ? null : (r[1] === 'ec' ? S.v.sal * EC_PER_SAL : S.v[r[1]] - (S.cal[r[1]] || 0))) : (f === 'electrode' ? null : r[1]);
        return '<div class="tline"><span class="tn">' + t(r[0]) + '</span><span class="tv">' + (v == null ? '— —' : fmt(v, r[2])) + '<small>' + r[3] + '</small></span>' +
          '<span class="tr">' + (v == null ? t('noval') : t('raw') + ' ' + r[4] + ' · ' + t('s_ok')) + '</span></div>';
      }).join('');
    }
    return '<div class="tcard' + (f && f !== 'run' ? ' fault' : '') + '">' + head + body + '</div>';
  }).join('');
  return '<div class="scr">' + subBar(t('set_test'), '<button class="btn" data-a="runtest" data-fid="runtest"' + (S.testing ? ' disabled' : '') + '>' + ic('refresh') + t('retest') + '</button>') +
    '<div class="body"><div class="tgrid">' + cards + '</div></div></div>';
}

var CALS = ['temp', 'ph', 'oxy', 'sal'];
function vCal(){
  var rows = CALS.map(function(k){
    var m = METRICS[k], f = faultOf(k), off = S.cal[k], raw = S.v[k] - off;
    var sub = f ? t('e_' + f) : t('cal_sensor') + ' ' + fmt(raw, m.d) + ' ' + m.unit + (off ? ' → ' + t('cal_after') + ' ' + fmt(raw + off, m.d) : '');
    return '<div class="row"><div class="rn"><b>' + t(m.label) + '</b><small>' + sub + '</small></div>' +
      '<span class="off">' + (off ? fmtSigned(off, m.d) : '0') + '</span>' +
      '<button class="btn" data-a="calOpen" data-arg="' + k + '" data-fid="cal-' + k + '"' + (f ? ' disabled' : '') + '>' + t('cal_enter') + '</button>' +
      (off ? '<button class="btn ghost calr" data-a="calReset" data-arg="' + k + '" data-fid="calr-' + k + '">' + t('cal_reset') + '</button>' : '<span class="btn-ph"></span>') +
      '</div>';
  }).join('');
  return '<div class="scr">' + subBar(t('set_cal')) +
    '<div class="body"><div class="list">' + rows + '</div><p class="note">' + ic('warn', 's') + '<span>' + t('cal_note') + '</span></p></div></div>';
}

var NETS = [['SUHO_FARM', 4, true], ['iptime_N604', 3, true], ['KT_GiGA_5G_3F2A', 2, true], ['Muan_Free_WiFi', 1, false]];
function bars(n){ var s = ''; for(var i = 1; i <= 4; i++){ s += '<i' + (i <= n ? ' class="on"' : '') + '></i>'; } return '<span class="bars" aria-hidden="true">' + s + '</span>'; }
function vWifi(){
  var offl = S.scenario === 'offline';
  var cur = '<div class="cur-net' + (offl ? ' warn' : '') + '">' + ic('wifi') + '<span><b>' + esc(S.wifi) + '</b> · 192.168.0.37</span><span class="sp"></span>' +
    (offl ? '<span class="st" style="color:var(--warn)">' + ic('cloudoff', 's') + t('wifi_noinet') + '</span>' : '<span class="st okt">' + ic('check', 's') + t('wifi_now') + '</span>') + '</div>';
  var list = S.scanning ? '<p class="empty">' + t('scanning') + '</p>' : '<div class="list">' + NETS.map(function(nw, i){
    var isCur = nw[0] === S.wifi;
    var aria = nw[0] + ', ' + t('signal', {n:nw[1]}) + (nw[2] ? ', ' + t('secured') : '') + (isCur ? ', ' + t('wifi_now') : '');
    return '<button class="row rowbtn' + (isCur ? ' cur' : '') + '" data-a="wifi" data-arg="' + esc(nw[0]) + '" data-fid="w-' + i + '" aria-label="' + esc(aria) + '">' +
      '<span class="rn"><b>' + esc(nw[0]) + '</b></span>' + (isCur ? '<span class="okt">' + ic('tick', 's') + t('wifi_now') + '</span>' : '') +
      (nw[2] ? ic('lock', 's dim') : '') + bars(nw[1]) + '</button>';
  }).join('') + '</div>';
  return '<div class="scr">' + subBar(t('set_wifi'), '<button class="btn" data-a="rescan" data-fid="rescan">' + ic('refresh') + t('rescan') + '</button>') +
    '<div class="body">' + cur + list + '</div></div>';
}

function vLang(){
  var b = LANGS.map(function(l){
    var on = S.lang === l[0];
    return '<button class="lang" data-a="lang" data-arg="' + l[0] + '" data-fid="l-' + l[0] + '" aria-pressed="' + on + '" lang="' + l[0] + '"><b>' + l[1] + '</b><small>' + l[2] + '</small>' + (on ? ic('check') : '') + '</button>';
  }).join('');
  return '<div class="scr">' + subBar(t('set_lang')) + '<div class="body"><div class="langs">' + b + '</div></div></div>';
}

var CIRCUITS = [['c_air', 'AIR-01', 1450, 7.6, 17.2, 46, true], ['c_pump', 'CIRC-01', 740, 3.9, 8.9, 41, true], ['c_heat', 'HEAT-01', 0, 0, 3.1, 38, false], ['c_uv', 'UV-01', 110, 0.6, 1.3, 35, true]];
function vPower(){
  var tw = 0, ta = 0, tk = 0;
  var rows = CIRCUITS.map(function(c){
    tw += c[2]; ta += c[3]; tk += c[4];
    return '<tr><td>' + t(c[0]) + '<small>' + c[1] + '</small></td><td><span class="onoff' + (c[6] ? ' on' : '') + '">' + t(c[6] ? 'on' : 'off') + '</span></td>' +
      '<td>' + fmt(c[2], 0) + '</td><td>' + fmt(c[3], 1) + '</td><td>' + fmt(c[4], 2) + '</td><td>' + fmt(c[5], 0) + '</td></tr>';
  }).join('');
  var head = '<tr><th scope="col">' + t('col_circuit') + '</th><th scope="col">' + t('col_state') + '</th><th scope="col">' + t('col_w') + '</th><th scope="col">' + t('col_a') + '</th><th scope="col">' + t('col_kwh') + '</th><th scope="col">' + t('col_tc') + '</th></tr>';
  var tot = '<tr class="tot"><td>' + t('total_in') + '<small>MAIN-01</small></td><td></td><td>' + fmt(tw, 0) + '</td><td>' + fmt(ta, 1) + '</td><td>' + fmt(tk, 2) + '</td><td>—</td></tr>';
  return '<div class="scr">' + subBar(t('set_power')) + '<div class="body"><table class="ptable"><thead>' + head + '</thead><tbody>' + tot + rows + '</tbody></table></div></div>';
}

function vPair(){
  var code = '482193', boxes = '';
  for(var i = 0; i < 6; i++){ boxes += '<span>' + code.charAt(i) + '</span>' + (i === 2 ? '<span class="gap"></span>' : ''); }
  var steps = ['pair_s1', 'pair_s2', 'pair_s3', 'pair_s4'].map(function(k, i){ return '<li><span class="n">' + (i + 1) + '</span><span>' + t(k) + '</span></li>'; }).join('');
  return '<div class="scr">' + subBar(t('pair_title'), '', 'cancel') +
    '<div class="body"><div class="pair">' +
      '<div><ol class="steps">' + steps + '</ol><p class="pnote">' + ic('info', 's') + '<span>' + t('pair_note') + '</span></p></div>' +
      '<div class="pcode"><div class="code" role="img" aria-label="' + esc(t('pair_code') + ' 4 8 2 1 9 3') + '">' + boxes + '</div>' +
        '<p class="exp" id="pairExp">' + t('pair_exp', {t:mmss(S.pairLeft)}) + '</p>' +
        '<p class="wait"><i></i><i></i><i></i>' + t('pair_wait') + '</p></div>' +
    '</div></div></div>';
}

/* ---------- 모달 ---------- */
function mRestart(){
  return '<div class="modal" role="dialog" aria-modal="true" aria-labelledby="dlg-t"><div class="dialog">' +
    '<h2 id="dlg-t">' + t('rs_title') + '</h2><p class="dsub">' + t('rs_body') + '</p>' +
    '<div class="dlg-btns"><button class="btn" data-a="modalClose" data-fid="m-cancel">' + t('cancel') + '</button>' +
    '<button class="btn danger" data-a="restartYes" data-fid="m-ok">' + ic('power') + t('rs_btn') + '</button></div></div></div>';
}
function mKp(){
  var k = S.kp.key, m = METRICS[k], buf = S.kp.buf;
  var keys = ['1', '2', '3', 'DEL', '4', '5', '6', '.', '7', '8', '9', '0'];
  var kp = keys.map(function(x, i){
    return x === 'DEL' ? '<button class="btn" data-a="keyDel" data-fid="kp-del" aria-label="' + t('del') + '">' + ic('del') + '</button>'
                       : '<button class="btn" data-a="key" data-arg="' + x + '" data-fid="kp-' + i + '">' + (x === '.' ? decSep() : x) + '</button>';
  }).join('');
  return '<div class="modal" role="dialog" aria-modal="true" aria-labelledby="dlg-t"><div class="dialog">' +
    '<h2 id="dlg-t">' + t('cal_kp_t', {m:t(m.label)}) + '</h2><p class="dsub">' + t('cal_kp_hint') + '</p>' +
    '<div class="kp-disp" aria-live="polite">' + (buf ? esc(buf.replace('.', decSep())) : '<span class="ph">' + fmt(S.v[k], m.d) + '</span>') + '<small>' + m.unit + '</small></div>' +
    '<div class="kp">' + kp + '</div>' +
    '<div class="dlg-btns"><button class="btn" data-a="modalClose" data-fid="m-cancel">' + t('cancel') + '</button>' +
    '<button class="btn primary" data-a="keyOk" data-fid="m-ok">' + t('apply') + '</button></div></div></div>';
}

var VIEWS = {boot:vBoot, main:vMain, chart:vChart, ai:vAI, info:vInfo, settings:vSettings, sensors:vSensors, test:vTest, cal:vCal, wifi:vWifi, lang:vLang, power:vPower, pair:vPair};
var MODALS = {restart:mRestart, kp:mKp};
var PARENT = {chart:'main', ai:'main', info:'main', settings:'main', sensors:'settings', test:'settings', cal:'settings', wifi:'settings', lang:'settings', power:'settings', pair:'settings'};
var LIVE = {main:1, chart:1, info:1, cal:1};

/* ======================= 렌더·이동 ======================= */
var view = document.getElementById('view'), lastScreen = null, kbd = false;
function render(isTick){
  if(isTick && (!LIVE[S.screen] || S.modal)) return;
  var a = document.activeElement, fid = a && view.contains(a) ? a.getAttribute('data-fid') : null;
  view.innerHTML = VIEWS[S.screen]() + (S.modal ? MODALS[S.modal]() : '');
  var first = view.firstElementChild, changed = S.screen !== lastScreen;
  if(changed && first) first.classList.add('enter');
  if(S.focusModal){
    S.focusModal = false;
    var mb = view.querySelector('.modal [data-fid="m-cancel"]'); if(mb) mb.focus({preventScroll:true});
  } else if(fid){
    var el = view.querySelector('[data-fid="' + fid + '"]'); if(el) el.focus({preventScroll:true});
  } else if(changed && kbd){
    var h = view.querySelector('h1[tabindex]'); if(h) h.focus({preventScroll:true});
  }
  lastScreen = S.screen;
  syncPanel();
}
function go(s){
  if(s === 'pair' || s === 'test') S.prev[s] = S.screen;
  if(s === 'pair') S.pairLeft = 600;
  S.screen = s; S.modal = null; render();
}
function jump(s){ S.prev = {}; clearTimeout(bootTimer); go(s); }
function back(){
  var cur = S.screen, p = S.prev[cur]; S.prev[cur] = null;
  S.screen = (p && p !== 'boot' && p !== cur) ? p : (PARENT[cur] || 'main'); S.modal = null; render();
}
var bootTimer;
function boot(){
  clearTimeout(bootTimer); S.modal = null; S.prev = {}; S.screen = 'boot'; render();
  bootTimer = setTimeout(function(){ S.screen = 'main'; render(); }, 1500);
}
function setScenario(k){
  S.scenario = k; S.acked = false; S.queued = k === 'unlinked' ? 18 : 37;
  if(k === 'alarm'){ S.v.oxy = 3.6; S.alarmAt = Date.now(); } else if(S.v.oxy < 4.5){ S.v.oxy = 5.6; }
  render();
}
function setLang(l){ S.lang = l; document.documentElement.lang = l; applyPanelText(); render(); }

var toastTimer;
function toast(msg){
  var el = document.getElementById('toast'); el.textContent = msg; el.hidden = false;
  clearTimeout(toastTimer); toastTimer = setTimeout(function(){ el.hidden = true; }, 2000);
}

var ACT = {
  go:function(s){ go(s); },
  back:function(){ back(); },
  chart:function(k){ S.chartKey = k; go('chart'); },
  range:function(r){ S.range = r; render(); },
  ack:function(){ S.acked = true; render(); },
  lang:function(l){ setLang(l); },
  toggle:function(k){ S.on[k] = !S.on[k]; toast(t('saved')); render(); },
  interval:function(n){ S.interval = +n; toast(t('saved')); render(); },
  show4:function(k){ S.show4 = k; toast(t('saved')); render(); },
  runtest:function(){ S.testing = true; render(); setTimeout(function(){ S.testing = false; render(); }, 1300); },
  modal:function(m){ S.modal = m; S.focusModal = true; render(); },
  modalClose:function(){ S.modal = null; render(); },
  restartYes:function(){ S.modal = null; boot(); },
  calOpen:function(k){ S.kp = {key:k, buf:''}; S.modal = 'kp'; S.focusModal = true; render(); },
  calReset:function(k){ S.v[k] -= S.cal[k]; S.cal[k] = 0; toast(t('saved')); render(); },
  key:function(d){
    var b = S.kp.buf;
    if(d === '.' && b.indexOf('.') >= 0) return;
    if(b.length >= 6) return;
    S.kp.buf = (b === '' && d === '.') ? '0.' : b + d; render();
  },
  keyDel:function(){ S.kp.buf = S.kp.buf.slice(0, -1); render(); },
  keyOk:function(){
    var x = parseFloat(S.kp.buf), k = S.kp.key;
    S.modal = null;
    if(!isNaN(x)){ var d = METRICS[k].d, raw = S.v[k] - S.cal[k]; S.cal[k] = Number((x - raw).toFixed(d)); S.v[k] = raw + S.cal[k]; toast(t('saved')); }
    render();
  },
  wifi:function(s){ if(s !== S.wifi) toast(t('wifi_pw', {s:s})); },
  rescan:function(){ S.scanning = true; render(); setTimeout(function(){ S.scanning = false; render(); }, 1000); }
};

view.addEventListener('click', function(e){
  if(demoTimer) stopDemo();
  var el = e.target.closest('[data-a]');
  if(!el || !view.contains(el) || el.disabled) return;
  var fn = ACT[el.getAttribute('data-a')];
  if(fn) fn(el.getAttribute('data-arg'));
});
document.addEventListener('keydown', function(e){
  if(e.key === 'Tab') kbd = true;
  if(e.key === 'Escape' && S.modal){ S.modal = null; render(); }
});
document.addEventListener('pointerdown', function(){ kbd = false; });

/* 값은 3초마다 조금씩(평균 회귀 + 잡음). 오프라인·미연결이면 보관 건수가 늘어난다 */
setInterval(function(){
  ['temp', 'ph', 'oxy', 'sal'].forEach(function(k){
    var m = METRICS[k], tg = (k === 'oxy' && S.scenario === 'alarm') ? 3.6 : TARGET[k] + (S.cal[k] - (k === 'ph' ? 0.04 : 0));
    S.v[k] += (tg - S.v[k]) * 0.2 + (Math.random() - 0.5) * m.noise * 2;
  });
  if((S.scenario === 'offline' || S.scenario === 'unlinked') && Math.random() < 0.4) S.queued++;
  render(true);
}, 3000);
setInterval(function(){
  if(S.screen !== 'pair') return;
  S.pairLeft = S.pairLeft > 0 ? S.pairLeft - 1 : 600;
  var el = document.getElementById('pairExp'); if(el) el.textContent = t('pair_exp', {t:mmss(S.pairLeft)});
}, 1000);

/* ======================= 바깥 패널 ======================= */
function applyPanelText(){
  document.querySelectorAll('[data-ui]').forEach(function(el){ el.textContent = ui(el.getAttribute('data-ui')); });
  document.querySelectorAll('[data-ui-label]').forEach(function(el){ el.setAttribute('aria-label', ui(el.getAttribute('data-ui-label'))); });
  document.getElementById('navOpts').setAttribute('aria-label', ui('g_screens'));
  document.title = ui('title');
  updDemoBtn();
}
function setPressed(k, v){
  document.querySelectorAll('[data-p^="' + k + ':"]').forEach(function(b){ b.setAttribute('aria-pressed', b.getAttribute('data-p') === k + ':' + v ? 'true' : 'false'); });
}
function syncPanel(){
  setPressed('scen', S.scenario); setPressed('scheme', S.scheme); setPressed('theme', S.theme);
  setPressed('lang', S.lang); setPressed('name', String(S.nameIx));
  var cur = S.modal === 'restart' ? 'restart' : S.screen;
  document.querySelectorAll('[data-p^="nav:"]').forEach(function(b){
    if(b.getAttribute('data-p') === 'nav:' + cur) b.setAttribute('aria-current', 'true'); else b.removeAttribute('aria-current');
  });
}
var STAY = {main:1, chart:1, ai:1, info:1, test:1, wifi:1};
document.querySelector('.panel').addEventListener('click', function(e){
  var b = e.target.closest('[data-p]'); if(!b) return;
  var p = b.getAttribute('data-p').split(':'), k = p[0], v = p[1], root = document.documentElement;
  stopDemo();
  if(k === 'scen'){ setScenario(v); if(!STAY[S.screen]) jump('main'); }
  else if(k === 'nav'){
    if(v === 'boot') boot();
    else if(v === 'restart'){ jump('settings'); S.modal = 'restart'; S.focusModal = true; render(); }
    else jump(v);
  }
  else if(k === 'scheme'){ S.scheme = v; root.setAttribute('data-scheme', v); syncPanel(); }
  else if(k === 'theme'){ S.theme = v; root.setAttribute('data-theme', v); syncPanel(); }
  else if(k === 'lang'){ setLang(v); }
  else if(k === 'name'){ S.nameIx = +v; render(); }
});

/* ---------- 자동 데모 ---------- */
var DEMO = [
  {cap:'d_boot', ms:2200, run:function(){ setScenario('normal'); boot(); }},
  {cap:'d_main', ms:3200, run:function(){ jump('main'); }},
  {cap:'d_chart', ms:2800, run:function(){ S.range = '24h'; S.chartKey = 'oxy'; jump('chart'); }},
  {cap:'d_chart7', ms:2600, run:function(){ S.range = '7d'; render(); }},
  {cap:'d_ai', ms:3400, run:function(){ S.range = '24h'; jump('ai'); }},
  {cap:'d_alarm', ms:3800, run:function(){ setScenario('alarm'); jump('main'); }},
  {cap:'d_ack', ms:2400, run:function(){ ACT.ack(); }},
  {cap:'d_offline', ms:3000, run:function(){ setScenario('offline'); jump('main'); }},
  {cap:'d_sensor', ms:3000, run:function(){ setScenario('sensor'); jump('main'); }},
  {cap:'d_test', ms:2800, run:function(){ jump('test'); }},
  {cap:'d_unlinked', ms:3000, run:function(){ setScenario('unlinked'); jump('main'); }},
  {cap:'d_pair', ms:3200, run:function(){ jump('pair'); }},
  {cap:'d_settings', ms:2600, run:function(){ setScenario('normal'); jump('settings'); }},
  {cap:'d_cal', ms:2600, run:function(){ jump('cal'); }},
  {cap:'d_info', ms:3200, run:function(){ jump('info'); }},
  {cap:'d_end', ms:0, run:function(){ jump('main'); }}
];
var demoIx = -1, demoTimer = null;
var cap = document.getElementById('demoCap');
function stepDemo(){
  var st = DEMO[demoIx]; if(!st){ stopDemo(); return; }
  st.run();
  cap.textContent = (demoIx + 1) + '/' + DEMO.length + ' · ' + ui(st.cap);
  if(!st.ms){ stopDemo(true); return; }
  demoTimer = setTimeout(function(){ demoIx++; stepDemo(); }, st.ms);
}
function startDemo(){ stopDemo(); demoIx = 0; demoTimer = -1; updDemoBtn(); stepDemo(); updDemoBtn(); }
function stopDemo(keepCap){
  if(demoTimer && demoTimer !== -1) clearTimeout(demoTimer);
  var was = demoTimer !== null; demoTimer = null; demoIx = -1;
  if(was && !keepCap) cap.textContent = '';
  updDemoBtn();
}
function updDemoBtn(){
  var on = demoTimer !== null;
  document.getElementById('demoIc').setAttribute('href', on ? '#i-stop' : '#i-play');
  var tx = document.getElementById('demoTx'); tx.setAttribute('data-ui', on ? 'demo_stop' : 'demo_play'); tx.textContent = ui(on ? 'demo_stop' : 'demo_play');
}
document.getElementById('demoBtn').addEventListener('click', function(){ if(demoTimer !== null) stopDemo(); else startDemo(); });

/* ---------- 창 크기에 맞춰 기기 프레임 축소 ---------- */
function fit(){
  var stage = document.getElementById('stage'), fitEl = document.getElementById('fit'), dev = document.getElementById('device');
  var cs = getComputedStyle(stage);
  var w = stage.clientWidth - parseFloat(cs.paddingLeft) - parseFloat(cs.paddingRight);
  var maxH = Math.max(260, window.innerHeight - 160);
  var s = Math.min(1, w / 980, maxH / 600);
  dev.style.transform = 'scale(' + s + ')';
  dev.style.left = Math.max(0, (w - 980 * s) / 2) + 'px';
  fitEl.style.height = (600 * s) + 'px';
}
window.addEventListener('resize', fit);

applyPanelText();
fit();
boot();
})();
</script>
