="1.20" fill="#f4f6f8" stroke="#dde3e9" stroke-width="0.30"/><text x="6.00" y="65.00" font-family="sans-serif" font-size="3.00" text-anchor="start" fill="#4a5560" font-weight="normal">서버 저장 후 — 대시보드 · 그래프 · 임계값 알림 · 디지털 트윈이 같은 테이블을 읽는다.</text><text x="6.00" y="69.60" font-family="sans-serif" font-size="3.00" text-anchor="start" fill="#4a5560" font-weight="normal">기기 등록은 현장 화면의 6자리 페어링 코드로 계정에 연결한다.</text></svg>
