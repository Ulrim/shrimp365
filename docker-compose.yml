version: "3.9"

services:
  shrimp365:
    image: shrimp365:latest
    build:
      context: .
      args:
        # NEXT_PUBLIC_* are baked into the client bundle at build time
        NEXT_PUBLIC_SUPABASE_URL:      https://okecfkqpoigxvlsomqjc.supabase.co
        NEXT_PUBLIC_SUPABASE_ANON_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im9rZWNma3Fwb2lneHZsc29tcWpjIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzc4ODE2MzMsImV4cCI6MjA5MzQ1NzYzM30._2R8h2okwLc7DlXPm6XED9i2CDmJlOFhuyIlgfNA0Zs
        NEXT_PUBLIC_SITE_URL:          https://www.shrimp365.kr
        # 컬리버 탄소 MRV 플랫폼 진입 버튼. 배포 주소가 정해지면 값을 넣어 활성화한다.
        # 비워 두면(기본) 헤더/푸터에 버튼이 렌더되지 않는다.
        NEXT_PUBLIC_MRV_PLATFORM_URL:  ""
    container_name: shrimp365
    restart: unless-stopped
    env_file:
      - .env.local
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production

  # AI 어드바이저 로컬 추론 서버 — `--profile ai`로 옵트인 (기본 `up`에는 뜨지 않음).
  # 포트는 호스트에 노출하지 않는다 — 웹 컨테이너가 내부 네트워크(http://ollama:11434/v1)로만 접근.
  # shrimp365에 depends_on을 걸지 않는다 — 프로필 미활성 시 compose 기동이 깨진다.
  ollama:
    image: ollama/ollama
    container_name: ollama
    restart: unless-stopped
    profiles: ["ai"]
    volumes:
      - ollama-models:/root/.ollama   # 모델 저장 — pull 1회면 재기동에도 유지
    environment:
      OLLAMA_KEEP_ALIVE: 24h          # 모델 램 상주 — 매 요청 재로딩(수십 초) 방지
      OLLAMA_CONTEXT_LENGTH: "8192"   # KV 캐시 램 상한

  # 개체수 모니터링 추론 서비스(vision/) — `--profile vision` 으로 옵트인.
  # 카메라를 안 쓰는 농장에서는 뜨지 않아야 한다(CPU 추론이 무겁다).
  #
  # 포트를 호스트에 노출하지 않는다 — 웹 컨테이너가 내부망(http://vision:8000)
  # 으로만 부른다. 영상은 웹이 중계하고(/api/vision/stream/…), 실시간 연결만
  # 리버스 프록시가 /vision-ws 로 넘긴다(docs/VISION_DEPLOY.md 참고).
  vision:
    image: shrimp365-vision:latest
    build:
      context: ./vision
    container_name: shrimp365-vision
    restart: unless-stopped
    profiles: ["vision"]
    env_file:
      - .env.local
    environment:
      # 웹 컨테이너를 되부르는 주소 — 경보를 웹푸시로 내보낼 때만 쓴다.
      SHRIMP365_INTERNAL_URL: http://shrimp365:3000
      # 장비 터치스크린은 라즈베리파이에 붙이는 화면이다. 컨테이너에는 화면이
      # 없으므로 띄우지 않는다.
      KIOSK_ENABLED: "false"
    volumes:
      # 기기 키와 아직 못 올린 개체수가 여기 있다. 볼륨을 안 걸면 컨테이너를
      # 다시 만들 때마다 키가 사라져 **수조에 다시 연결해야** 하고, 그 사이
      # 못 올린 측정값도 함께 사라진다.
      - vision-state:/var/lib/shrimp365-vision
    # 모델(ai/models/shrimp_yolov8n_416.onnx, 12MB)은 이제 저장소에 들어 있어
    # `COPY . .` 로 이미지에 함께 굽힌다. 예전처럼 여기에 빈 볼륨을 걸면 그
    # 디렉터리를 **덮어써서** 모델이 사라지고, 서비스는 멀쩡히 뜬 채 가짜
    # 개체수를 쌓는다(시뮬레이션). 다른 가중치를 쓰려면 파일 하나만 걸어라:
    #   volumes:
    #     - ./내모델.onnx:/app/ai/models/내모델.onnx:ro
    #   environment:
    #     MODEL_PATH: /app/ai/models/내모델.onnx
    #     CONFIDENCE_THRESHOLD: "0.25"   # 해상도마다 최적값이 다르다
    # USB 카메라를 쓴다면 장치를 실어 준다(RTSP·HTTP 카메라는 필요 없다):
    # devices:
    #   - "/dev/video0:/dev/video0"

volumes:
  ollama-models:
  vision-state:
