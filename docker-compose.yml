version: "3.9"

services:
  shrimp365:
    image: shrimp365:latest          # 로컬에서 빌드한 이미지 이름
    container_name: shrimp365
    restart: unless-stopped
    ports:
      - "3000:3000"                  # NAS포트:컨테이너포트 (필요시 왼쪽 변경)
    environment:
      # ── Supabase ────────────────────────────────────────────────────────────
      NEXT_PUBLIC_SUPABASE_URL:        ${NEXT_PUBLIC_SUPABASE_URL}
      NEXT_PUBLIC_SUPABASE_ANON_KEY:   ${NEXT_PUBLIC_SUPABASE_ANON_KEY}
      SUPABASE_SERVICE_ROLE_KEY:       ${SUPABASE_SERVICE_ROLE_KEY}

      # ── AI ──────────────────────────────────────────────────────────────────
      ANTHROPIC_API_KEY:               ${ANTHROPIC_API_KEY}

      # ── Paddle Billing ───────────────────────────────────────────────────────
      PADDLE_ENV:                         ${PADDLE_ENV}
      PADDLE_API_KEY:                     ${PADDLE_API_KEY}
      PADDLE_WEBHOOK_SECRET:              ${PADDLE_WEBHOOK_SECRET}
      PADDLE_BASIC_PRICE_ID:              ${PADDLE_BASIC_PRICE_ID}
      PADDLE_PRO_PRICE_ID:                ${PADDLE_PRO_PRICE_ID}
      NEXT_PUBLIC_PADDLE_CLIENT_TOKEN:    ${NEXT_PUBLIC_PADDLE_CLIENT_TOKEN}
      NEXT_PUBLIC_PADDLE_ENV:             ${NEXT_PUBLIC_PADDLE_ENV}
      NEXT_PUBLIC_PADDLE_BASIC_PRICE_ID:  ${NEXT_PUBLIC_PADDLE_BASIC_PRICE_ID}
      NEXT_PUBLIC_PADDLE_PRO_PRICE_ID:    ${NEXT_PUBLIC_PADDLE_PRO_PRICE_ID}

      # ── 사이트 URL (NAS의 실제 접속 주소로 변경) ──────────────────────────
      NEXT_PUBLIC_SITE_URL:            ${NEXT_PUBLIC_SITE_URL}

      NODE_ENV: production
