[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "culiver-api"
version = "0.1.0"
description = "컬리버 MRV 플랫폼 FastAPI 백엔드(스프린트 0)."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }
authors = [{ name = "Culiver" }]

dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "pydantic>=2.6",
    "pydantic-settings>=2.1",
    "pyjwt>=2.8",
    "psycopg[binary]>=3.1",
    # 주기 배치(작업 큐) — phase-2 슬라이스 H job_evaluate_alerts 스케줄링(worker.py).
    # 미설치 환경에서는 worker.py 가 ModuleNotFoundError 를 잡아 heartbeat 폴백한다.
    "apscheduler>=3.10",
    # KPI 산식 엔진: 로컬 경로 의존성(산식 단일 진실 공급원).
    #   pip install -e ../../packages/kpi 로 설치되며 아래 소스 핀으로도 명시.
    "culiver-kpi",
    # MRV 리포트 PDF 파이프라인(Phase 3 슬라이스 M, ADR 0004): HTML 템플릿 + WeasyPrint 렌더.
    # WeasyPrint 는 네이티브 라이브러리(pango/cairo/gdk-pixbuf) 의존 — Dockerfile 참고.
    "jinja2>=3.1",
    "weasyprint>=61",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",
    "ruff>=0.4",
]

# uv 사용 시 로컬 경로에서 kpi 패키지를 해석하도록 소스를 고정한다.
[tool.uv.sources]
culiver-kpi = { path = "../../packages/kpi", editable = true }

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
# B008: FastAPI 의 Depends()/Query() 를 인자 기본값에 두는 것은 공식 권장 관용구다.
ignore = ["E501", "B008"]

[tool.ruff.lint.per-file-ignores]
# conftest 는 app 임포트 전에 sys.path/환경변수를 세팅해야 하므로 임포트가 코드 뒤에 온다.
"tests/conftest.py" = ["E402", "I001"]
# tests_rls/* 도 동일 — app 임포트 전에 DATABASE_URL/AUTH_MODE 세팅(conftest) 과
# 모듈 수준 skip 게이트(_gate.require_rls_database) 호출이 임포트보다 먼저 와야 한다.
# (ADR 0007 4절: SQLite conftest 상속을 피하려 tests/ 의 형제 디렉터리로 둔다.)
"tests_rls/*.py" = ["E402", "I001"]
