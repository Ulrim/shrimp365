# 컬리버 MRV 플랫폼 로컬 개발 스택(스프린트 0).
# 서비스: db(TimescaleDB), mqtt, api, worker, web(선택).
# 실행: make dev  (== docker compose -f infra/docker-compose.yml up)

services:
  db:
    image: timescale/timescaledb:latest-pg16
    environment:
      # ★ POSTGRES_USER 는 공식 이미지가 `initdb --username=` 으로 만드는 **부트스트랩
      #   superuser** 다. superuser 는 RLS 를 전면 우회하므로 이 역할은 **소유자/마이그레이션
      #   전용**이고, 런타임 앱은 아래 APP_DB_USER 로만 접속한다(ADR 0007 5절 = D5).
      POSTGRES_USER: ${POSTGRES_USER:-culiver}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me-strong-password}
      POSTGRES_DB: ${POSTGRES_DB:-culiver}
      # 런타임 앱 역할(NOSUPERUSER NOBYPASSRLS). db/init/10_app_role.sh 가 읽는다.
      APP_DB_USER: ${APP_DB_USER:-culiver_app}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:?APP_DB_PASSWORD 가 필요하다 — infra/.env 에 설정하라(ADR 0007 5절)}
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
      # 최초 기동 시 부트스트랩(파일명 사전순 실행):
      #   00_extensions.sql  — TimescaleDB 확장
      #   10_app_role.sh     — 런타임 앱 역할 + ALTER DEFAULT PRIVILEGES(ADR 0007 5절)
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-culiver} -d ${POSTGRES_DB:-culiver}"]
      interval: 10s
      timeout: 5s
      retries: 5

  mqtt:
    image: eclipse-mosquitto:2
    ports:
      - "1883:1883"
    volumes:
      - ./mqtt/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
    healthcheck:
      test: ["CMD-SHELL", "mosquitto_sub -t '$$SYS/#' -C 1 -W 3 -h localhost || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5

  api:
    build:
      # 빌드 컨텍스트 = repo 루트(kpi 로컬 의존성 복사를 위해).
      context: ..
      dockerfile: apps/api/Dockerfile
    env_file:
      - .env
    environment:
      # 런타임: 비 superuser 역할 → RLS 가 실제로 적용된다(ADR 0007 5절).
      DATABASE_URL: ${APP_DATABASE_URL:-postgresql+psycopg://culiver_app:change-me-app-password@db:5432/culiver}
      # 마이그레이션: 소유자(superuser) 역할 — CREATE TABLE/POLICY/hypertable DDL 에 필요.
      # 런타임 URL 과 분리되어 있어야 앱이 DDL 권한을 들고 다니지 않는다(최소권한).
      MIGRATION_DATABASE_URL: ${MIGRATION_DATABASE_URL:-postgresql+psycopg://culiver:change-me-strong-password@db:5432/culiver}
    ports:
      - "8000:8000"
    volumes:
      # MRV 리포트 PDF 산출물 보존(phase-3.md 1.8절 — 컨테이너 재기동에도 유지).
      - mrv_reports_data:/app/var/mrv-reports
    depends_on:
      db:
        condition: service_healthy
    # 기동 시 마이그레이션 적용 후 API 실행.
    # alembic 만 소유자 URL 로 실행하고(DATABASE_URL 을 그 프로세스에만 덮어씀),
    # uvicorn 은 컨테이너 환경의 DATABASE_URL(=culiver_app)을 그대로 쓴다(ADR 0007 5절).
    command: >
      sh -c "DATABASE_URL=\"$${MIGRATION_DATABASE_URL:-$$DATABASE_URL}\" python -m alembic -c /app/alembic.ini upgrade head &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000"
    healthcheck:
      # /ready 는 DB `SELECT 1` 까지 확인한다(8.3절) — /health(liveness)는 DB 끊김을 못 잡는다.
      test: ["CMD-SHELL", "curl -fsS http://localhost:8000/ready || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5

  worker:
    build:
      context: ..
      dockerfile: apps/api/Dockerfile
    env_file:
      - .env
    environment:
      # 워커도 런타임 역할(비 superuser)로만 접속한다 — 알림 배치는 org 별 컨텍스트 순회로
      # 전 org 를 평가하므로 BYPASSRLS 가 필요 없다(ADR 0007 3절).
      DATABASE_URL: ${APP_DATABASE_URL:-postgresql+psycopg://culiver_app:change-me-app-password@db:5432/culiver}
    depends_on:
      db:
        condition: service_healthy
    command: ["python", "worker.py"]

  # 프론트엔드(frontend-engineer 담당). apps/web 생성 후 활성화.
  # web:
  #   build:
  #     context: ../apps/web
  #   ports:
  #     - "5173:5173"
  #   depends_on:
  #     api:
  #       condition: service_healthy

volumes:
  db_data:
  mrv_reports_data:
